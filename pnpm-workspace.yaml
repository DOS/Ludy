# Require every npm version to be at least 24 hours (1440 minutes) old before install (SEC-03, #3976). Setting
# minimumReleaseAge explicitly enables strict mode by default in pnpm >= 12.3.0 (pnpm/pnpm#14409), so a too-new
# version fails instead of being quietly appended to minimumReleaseAgeExclude. Keep minimumReleaseAgeExclude empty
# unless an urgent patch needs a documented reason; minimumReleaseAgeExcludePrune drops entries once the lockfile
# moves past them.
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true

allowBuilds:
  sharp: true
  # Its install script only copies the x64 7-Zip files to the names Squirrel uses and (in 5.4.4) reads `os.arch` without calling it. Not run on every install:
  # the Windows build job copies the two files itself (.github/workflows/desktop-build.yml).
  electron-winstaller: false

# dependency-cruiser parses TypeScript with the TypeScript compiler API, which the native TypeScript 7 the workspace
# typechecks with does not ship; it accepts typescript <7. TypeScript 6, the last release with the JS API, is its own
# dependency here and nobody else's (#1651).
packageExtensions:
  dependency-cruiser@18:
    dependencies:
      typescript: 6.0.3

patchedDependencies:
  exceljs@4.4.0: patches/exceljs.patch
