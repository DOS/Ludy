# Added to ../docker-compose.yml and compose.e2e.yml for the AI end-to-end job only (#3805; `pnpm --filter @ludy/e2e stack:up:ai`). It turns the recorder's Vy summary on and points the model at a fake service
# on the stack's own network, so no spec ever reaches a real model. The default stack (compose.e2e.yml alone) has no model and MEETINGS_SUMMARY off, and the specs of e2e/tests rely on that: never add these
# settings there. Paths are relative to the first compose file (the repository root).
services:
  crove:
    environment:
      AI_BASE_URL: http://fake-model:30001/v1
      AI_MODEL: fake-summary
      MEETINGS_SUMMARY: 'on'
    # Joins the model's own network, on top of the networks it already has.
    networks:
      - model
  # A fixed answer to every chat completion (e2e/fake-model): it makes no request of its own and refuses any other host name.
  fake-model:
    image: node:26-slim@sha256:193fe51b64e77981119c98c2002c9e32a70e2f006fb4d25068ce0558998917f0
    working_dir: /srv
    command: ['node', 'main.ts']
    environment:
      PORT: '30001'
    volumes:
      - ./e2e/fake-model:/srv:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    # Only the model's network, which is internal: the service is reachable from crove and from nothing else, and has no route out. "Reaches no other host" is enforced here, not only by its code.
    networks:
      - model
networks:
  model:
    internal: true
