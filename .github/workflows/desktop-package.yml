name: desktop-package

# Ludy Desktop signed packaging workflow (#4884 Windows, #4885 macOS, ADR-0055, docs/desktop/signing-runbook.md, docs/desktop/mac-signing-runbook.md):
# - Dispatched strictly from `refs/heads/main` (`workflow_dispatch`):
#   - `mode=dry-run` (default) builds unsigned installers without secrets for verification.
#   - `mode=signed` validates an existing `desktop-vX.Y.Z` tag on `main` + green CI gates, runs `build-signed` (Windows) and
#     `build-mac-signed` (macOS) inside the protected `desktop-release` GitHub environment (main-only deployment branch + owner
#     approval required), signs and notarizes/verifies outputs using operator-supplied secrets (failing closed if secrets are
#     missing or invalid), generates release-manifest.json and SHA256SUMS.txt, and creates a draft GitHub Release
#     (`--draft --latest=false`) after re-verifying the live tag SHA.
# - No certificate, password, token, or private key is ever stored in this workflow or repository.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build mode (dry-run builds unsigned without secrets; signed requires desktop-release approval and tag on main)
        type: choice
        options: [dry-run, signed]
        default: dry-run
      platform:
        description: Target platforms to package (windows, macos, or all)
        type: choice
        options: [windows, macos, all]
        default: windows
      version:
        description: Version X.Y.Z for dry-run builds
        type: string
        required: false
        default: '0.1.0'
      tag:
        description: Existing release tag desktop-vX.Y.Z on main when running mode=signed
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: desktop-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release target and CI gates
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.target.outputs.mode }}
      version: ${{ steps.target.outputs.version }}
      tag: ${{ steps.target.outputs.tag }}
      sha: ${{ steps.target.outputs.sha }}
      build_windows: ${{ steps.target.outputs.build_windows }}
      build_macos: ${{ steps.target.outputs.build_macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release tag, version, platform, and main ancestry
        id: target
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != 'workflow_dispatch' ] || [ "$REF" != 'refs/heads/main' ]; then
            echo "::error::desktop-package runs only via workflow_dispatch from refs/heads/main (got $EVENT on $REF)"
            exit 1
          fi

          build_windows='false'
          build_macos='false'
          case "${INPUT_PLATFORM:-windows}" in
            all)
              build_windows='true'
              build_macos='true'
              ;;
            windows)
              build_windows='true'
              ;;
            macos)
              build_macos='true'
              ;;
            *)
              echo "::error::unsupported platform selection '$INPUT_PLATFORM'"
              exit 1
              ;;
          esac

          mode='dry-run'
          version=''
          tag=''
          target_sha="$SHA"

          if [ "$INPUT_MODE" = 'signed' ]; then
            mode='signed'
            tag="${INPUT_TAG:-}"
            if ! [[ "$tag" =~ ^desktop-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::release tag must match desktop-vX.Y.Z (got '$tag')"
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
            git fetch --no-tags origin main "refs/tags/$tag:refs/tags/$tag"
            target_sha="$(git rev-parse "refs/tags/$tag^{commit}")"
            if ! git merge-base --is-ancestor "$target_sha" origin/main; then
              echo "::error::$tag ($target_sha) is not on a commit of main"
              exit 1
            fi
            package_version="$(git show "$target_sha:apps/desktop/package.json" | jq -r '.version // empty')"
            if [ "$package_version" != "$version" ]; then
              echo "::error::$tag says $version, but apps/desktop/package.json at $target_sha says $package_version"
              exit 1
            fi
          elif [ "$INPUT_MODE" = 'dry-run' ]; then
            mode='dry-run'
            version="$INPUT_VERSION"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::dry-run version must match X.Y.Z (got '$version')"
              exit 1
            fi
          else
            echo "::error::unsupported release mode '$INPUT_MODE'"
            exit 1
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "build_windows=$build_windows" >> "$GITHUB_OUTPUT"
          echo "build_macos=$build_macos" >> "$GITHUB_OUTPUT"
          echo "### Ludy Desktop release ($mode, platform=${INPUT_PLATFORM:-windows}): $version (${tag:-no tag}, $target_sha)" >> "$GITHUB_STEP_SUMMARY"

      - name: Required CI checks are green on the release commit
        if: steps.target.outputs.mode == 'signed'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
          BUILD_WINDOWS: ${{ steps.target.outputs.build_windows }}
          BUILD_MACOS: ${{ steps.target.outputs.build_macos }}
        run: |
          set -euo pipefail
          check_workflow_jobs() {
            local target_sha="$1"
            local workflow_path="$2"
            shift 2
            local run_row run_id run_status run_conclusion jobs name row status conclusion
            run_row="$(gh api "repos/$REPO/actions/runs?head_sha=$target_sha&per_page=100" --paginate --slurp \
              | WF_PATH="$workflow_path" jq -r '[.[].workflow_runs[] | select(.path == env.WF_PATH and .head_branch == "main" and (.event == "push" or .event == "workflow_dispatch") and .head_repository.full_name == env.REPO)] | sort_by(.created_at) | last | if . == null then empty else [.id, .status, (.conclusion // "")] | @tsv end')"
            if [ -z "$run_row" ]; then
              for name in "$@"; do
                pending+=("$name@$target_sha")
              done
              return
            fi
            run_id="$(cut -f1 <<<"$run_row")"
            run_status="$(cut -f2 <<<"$run_row")"
            run_conclusion="$(cut -f3 <<<"$run_row")"
            if [ "$run_status" != 'completed' ]; then
              for name in "$@"; do
                pending+=("$name@$target_sha")
              done
              return
            fi
            if [ "$run_conclusion" != 'success' ]; then
              failed+=("workflow:$workflow_path@$target_sha: $run_conclusion")
              return
            fi
            jobs="$(gh api "repos/$REPO/actions/runs/$run_id/jobs?per_page=100" --paginate --slurp \
              | jq -r '.[].jobs[] | [.name, .status, (.conclusion // "")] | @tsv')"
            for name in "$@"; do
              row="$(awk -F'\t' -v n="$name" '$1 == n { print; exit }' <<<"$jobs")"
              status="$(cut -f2 <<<"$row")"
              conclusion="$(cut -f3 <<<"$row")"
              if [ "$status" != 'completed' ]; then
                pending+=("$name@$target_sha")
              elif [ "$conclusion" != 'success' ]; then
                failed+=("$name@$target_sha: $conclusion")
              fi
            done
          }

          desktop_jobs=()
          if [ "$BUILD_WINDOWS" = 'true' ]; then
            desktop_jobs+=('Windows build (unsigned), tests, size and memory' 'Windows install smoke (tray, sign-in, update A to B, uninstall)')
          fi
          if [ "$BUILD_MACOS" = 'true' ]; then
            desktop_jobs+=('macOS build (unsigned, arm64 & x64), tests and size')
          fi

          deadline=$((SECONDS + 1800))
          while :; do
            pending=()
            failed=()
            check_workflow_jobs "$SHA" '.github/workflows/ci.yml' 'Lint, typecheck, unit tests'
            check_workflow_jobs "$SHA" '.github/workflows/desktop-build.yml' "${desktop_jobs[@]}"
            if ((${#failed[@]} > 0)); then
              printf '::error::required check not green: %s\n' "${failed[*]}"
              exit 1
            fi
            if ((${#pending[@]} == 0)); then
              echo "All required CI and desktop build checks succeeded on release commit $SHA"
              break
            fi
            if ((SECONDS >= deadline)); then
              printf '::error::timed out waiting for required checks: %s\n' "${pending[*]}"
              exit 1
            fi
            echo "Waiting for required checks: ${pending[*]}"
            sleep 30
          done

  build-dry-run:
    name: Windows dry-run build (unsigned, no secrets)
    needs: prepare
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.mode == 'dry-run' && needs.prepare.outputs.build_windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install pnpm
        run: npm install -g pnpm@10.34.7 --no-fund --no-audit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@ludy/desktop" --filter "ludy-monorepo"

      - name: Typecheck
        run: pnpm --filter "@ludy/desktop" typecheck

      - name: Unit tests
        run: pnpm exec vitest run --project unit apps/desktop

      - name: Compile Win32 WASAPI loopback helper
        run: node apps/desktop/scripts/build-native.mjs --require-win32

      - name: Build unsigned dry-run installer and release manifest
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node apps/desktop/scripts/package.mjs --version "$env:VERSION" --skip-native
          if ($LASTEXITCODE -ne 0) { throw "package.mjs failed with exit code $LASTEXITCODE" }

      - name: Verify dry-run installer artifacts and manifest
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'apps/desktop/out/installer'
          foreach ($f in @('LudyDesktop-Setup.exe', 'RELEASES', 'release-manifest.json', 'SHA256SUMS.txt')) {
            if (-not (Test-Path -PathType Leaf "$out/$f")) { throw "missing $f" }
          }
          $manifest = Get-Content "$out/release-manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.version -ne $env:VERSION) { throw "manifest version mismatch: $($manifest.version)" }
          if ($manifest.signed -ne $false) { throw 'dry-run manifest must report signed=false' }

      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ludy-desktop-dry-run-win32-x64
          path: apps/desktop/out/installer/
          retention-days: 7
          if-no-files-found: error

  build-mac-dry-run:
    name: macOS dry-run build (unsigned, arm64 & x64, no secrets)
    needs: prepare
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.mode == 'dry-run' && needs.prepare.outputs.build_macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install pnpm
        run: npm install -g pnpm@10.34.7 --no-fund --no-audit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@ludy/desktop" --filter "ludy-monorepo"

      - name: Typecheck
        run: pnpm --filter "@ludy/desktop" typecheck

      - name: Unit tests
        run: pnpm exec vitest run --project unit apps/desktop

      - name: Build unsigned macOS dry-run installers and manifests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node apps/desktop/scripts/package-mac.mjs --version "$VERSION" --arch all

      - name: Verify macOS dry-run artifacts and manifests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            arch_dir="apps/desktop/out/mac/darwin-$arch"
            dmg="LudyDesktop-${VERSION}-darwin-${arch}.dmg"
            zip="LudyDesktop-${VERSION}-darwin-${arch}.zip"
            [ -s "$arch_dir/$dmg" ] || { echo "::error::missing $dmg"; exit 1; }
            [ -s "$arch_dir/$zip" ] || { echo "::error::missing $zip"; exit 1; }
            [ -s "$arch_dir/release-manifest.json" ] || { echo "::error::missing release-manifest.json"; exit 1; }
            [ -s "$arch_dir/SHA256SUMS.txt" ] || { echo "::error::missing SHA256SUMS.txt"; exit 1; }
            (cd "$arch_dir" && shasum -a 256 -c SHA256SUMS.txt)
            node -e '
              const fs = require("node:fs");
              const m = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (m.version !== process.argv[2] || m.platform !== "darwin" || m.arch !== process.argv[3] || m.signed !== false) {
                throw new Error("Unexpected dry-run macOS manifest: " + JSON.stringify(m));
              }
            ' "$arch_dir/release-manifest.json" "$VERSION" "$arch"
          done

      - name: Upload macOS dry-run artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ludy-desktop-dry-run-darwin
          path: apps/desktop/out/mac/
          retention-days: 7
          if-no-files-found: error

  build-signed:
    name: Build and sign Windows installer
    needs: prepare
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.mode == 'signed' && needs.prepare.outputs.build_windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    environment: desktop-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install pnpm
        run: npm install -g pnpm@10.34.7 --no-fund --no-audit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@ludy/desktop" --filter "ludy-monorepo"

      # Fail closed early if signing secrets are missing or incomplete; defer PFX import until right before package.mjs --sign.
      - name: Validate signing secret presence
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_SIGN_WITH_PARAMS: ${{ secrets.WINDOWS_SIGN_WITH_PARAMS }}
          WINDOWS_SIGN_HOOK_MODULE_PATH: ${{ secrets.WINDOWS_SIGN_HOOK_MODULE_PATH }}
        run: |
          $ErrorActionPreference = 'Stop'
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PFX_BASE64)
          $hasPwd = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)
          $hasParams = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_WITH_PARAMS)
          $hasHook = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_HOOK_MODULE_PATH)

          if ($hasPfx -xor $hasPwd) {
            Write-Error 'Both WINDOWS_CERT_PFX_BASE64 and WINDOWS_CERT_PASSWORD must be set together.'
            exit 1
          }
          $modes = @($hasPfx, $hasParams, $hasHook) | Where-Object { $_ }
          if ($modes.Count -eq 0) {
            Write-Error 'Missing Windows signing secrets in the desktop-release environment. Configure WINDOWS_CERT_PFX_BASE64 + WINDOWS_CERT_PASSWORD, WINDOWS_SIGN_WITH_PARAMS, or WINDOWS_SIGN_HOOK_MODULE_PATH. See docs/desktop/signing-runbook.md.'
            exit 1
          }
          if ($modes.Count -gt 1) {
            Write-Error 'Ambiguous Windows signing secrets in the desktop-release environment: configure exactly one signing mode.'
            exit 1
          }

      - name: Typecheck
        run: pnpm --filter "@ludy/desktop" typecheck

      - name: Unit tests
        run: pnpm exec vitest run --project unit apps/desktop

      - name: Compile Win32 WASAPI loopback helper
        run: node apps/desktop/scripts/build-native.mjs --require-win32

      # Inspect the PFX with X509Certificate2Collection (multi-cert safe, exactly 1 private-key leaf), enforce anti-clobber,
      # import ephemerally right before packaging, and record only newly imported thumbprints for guaranteed cleanup.
      - name: Stage ephemeral PFX signing certificate
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PFX_BASE64)) {
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'ludy-signing.pfx'
          $bytes = [System.Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64.Trim())
          [System.IO.File]::WriteAllBytes($pfxPath, $bytes)
          try {
            $secure = ConvertTo-SecureString -String $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
            $col = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2Collection
            $col.Import($pfxPath, $env:WINDOWS_CERT_PASSWORD, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
            try {
              $leaves = @($col | Where-Object { $_.HasPrivateKey })
              if ($leaves.Count -ne 1) {
                throw "PFX must contain exactly 1 certificate with a private key (found $($leaves.Count))"
              }
              $leafThumb = ($leaves[0].Thumbprint -replace '\s+', '').ToUpperInvariant()
              if ($leafThumb -notmatch '^[0-9A-F]{40}$') {
                throw 'PFX private-key leaf certificate has no valid SHA-1 thumbprint'
              }

              $preExisting = @{}
              foreach ($c in (Get-ChildItem -LiteralPath 'Cert:\CurrentUser\My')) {
                if ($c.Thumbprint) { $preExisting[($c.Thumbprint -replace '\s+', '').ToUpperInvariant()] = $true }
              }
              if ($preExisting.ContainsKey($leafThumb)) {
                throw "Certificate $leafThumb already exists in Cert:\CurrentUser\My; refusing to overwrite or delete pre-existing store entry."
              }

              $cleanupCandidates = @()
              foreach ($c in $col) {
                if ($c.Thumbprint) {
                  $t = ($c.Thumbprint -replace '\s+', '').ToUpperInvariant()
                  if ($t -match '^[0-9A-F]{40}$' -and -not $preExisting.ContainsKey($t) -and ($cleanupCandidates -notcontains $t)) {
                    $cleanupCandidates += $t
                  }
                }
              }
              if ($cleanupCandidates.Count -gt 0) {
                "WINDOWS_CERT_CLEANUP_THUMBS=$($cleanupCandidates -join ',')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              }

              $importedThumbs = @()
              try {
                $imported = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $secure)
                foreach ($item in $imported) {
                  if ($item.Thumbprint) {
                    $t = ($item.Thumbprint -replace '\s+', '').ToUpperInvariant()
                    if ($t -match '^[0-9A-F]{40}$' -and -not $preExisting.ContainsKey($t) -and ($importedThumbs -notcontains $t)) {
                      $importedThumbs += $t
                    }
                  }
                }
                if ($importedThumbs -notcontains $leafThumb) {
                  throw "Expected private-key leaf thumbprint $leafThumb was not imported into Cert:\CurrentUser\My"
                }
                $leafInStore = Get-Item -LiteralPath "Cert:\CurrentUser\My\$leafThumb" -ErrorAction Stop
                if (-not $leafInStore.HasPrivateKey) {
                  throw "Imported leaf certificate $leafThumb in Cert:\CurrentUser\My is missing private key"
                }
              } catch {
                foreach ($t in @($importedThumbs + $cleanupCandidates | Select-Object -Unique)) {
                  if ($t -match '^[0-9A-F]{40}$') {
                    $p = "Cert:\CurrentUser\My\$t"
                    if (Test-Path -LiteralPath $p) { Remove-Item -LiteralPath $p -DeleteKey -ErrorAction SilentlyContinue }
                  }
                }
                throw
              }

              $allCleanup = @($importedThumbs + $cleanupCandidates | Select-Object -Unique)
              if ($allCleanup.Count -gt 0) {
                "WINDOWS_CERT_CLEANUP_THUMBS=$($allCleanup -join ',')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              }
              "WINDOWS_CERT_SHA1=$leafThumb" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            } finally {
              foreach ($c in $col) { $c.Dispose() }
            }
          } finally {
            if (Test-Path -LiteralPath $pfxPath) { Remove-Item -LiteralPath $pfxPath -Force }
          }

      - name: Build and sign Squirrel.Windows installer and feed artifacts
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          WINDOWS_TIMESTAMP_SERVER: ${{ vars.WINDOWS_TIMESTAMP_SERVER }}
          WINDOWS_SIGN_WITH_PARAMS: ${{ secrets.WINDOWS_SIGN_WITH_PARAMS }}
          WINDOWS_SIGNTOOL_PATH: ${{ vars.WINDOWS_SIGNTOOL_PATH }}
          WINDOWS_SIGN_HOOK_MODULE_PATH: ${{ secrets.WINDOWS_SIGN_HOOK_MODULE_PATH }}
        run: |
          node apps/desktop/scripts/package.mjs --version "$env:VERSION" --skip-native --sign
          if ($LASTEXITCODE -ne 0) { throw "package.mjs --sign failed with exit code $LASTEXITCODE" }

      - name: Verify release manifest and checksums
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'apps/desktop/out/installer'
          foreach ($f in @('LudyDesktop-Setup.exe', 'RELEASES', 'release-manifest.json', 'release-manifest.ps1', 'SHA256SUMS.txt')) {
            if (-not (Test-Path -PathType Leaf "$out/$f")) { throw "missing $f" }
          }
          $manifest = Get-Content "$out/release-manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.version -ne $env:VERSION) { throw "manifest version mismatch: $($manifest.version)" }
          if ($manifest.signed -ne $true) { throw 'signed release manifest must report signed=true' }
          if (-not ($manifest.signing.publisherThumbprint -match '^[0-9a-f]{40}$')) { throw 'missing publisherThumbprint in manifest' }

          $sig = Get-AuthenticodeSignature -LiteralPath "$out/LudyDesktop-Setup.exe"
          if ($sig.Status -ne 'Valid' -or $null -eq $sig.TimeStamperCertificate) {
            throw "LudyDesktop-Setup.exe signature check failed: $($sig.Status)"
          }

          $lines = @(
            '### Ludy Desktop signed release (win32-x64)',
            '',
            ('- version: `{0}`' -f $manifest.version),
            ('- installer SHA-256: `{0}`' -f $manifest.installer.sha256),
            ('- signer thumbprint: `{0}`' -f $manifest.signing.publisherThumbprint)
          )
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Clean up ephemeral signing certificate
        if: always()
        shell: pwsh
        run: |
          $rawList = @()
          if ($env:WINDOWS_CERT_CLEANUP_THUMBS) {
            $rawList += ($env:WINDOWS_CERT_CLEANUP_THUMBS -split ',')
            if ($env:WINDOWS_CERT_SHA1) {
              $rawList += $env:WINDOWS_CERT_SHA1
            }
          }
          $uniqueThumbs = @($rawList | ForEach-Object { ($_ -replace '\s+', '').ToUpperInvariant() } | Where-Object { $_ -match '^[0-9A-F]{40}$' } | Select-Object -Unique)
          $cleanupErrors = @()
          foreach ($t in $uniqueThumbs) {
            $storePath = "Cert:\CurrentUser\My\$t"
            if (Test-Path -LiteralPath $storePath) {
              try {
                Remove-Item -LiteralPath $storePath -DeleteKey -ErrorAction Stop
              } catch {
                $cleanupErrors += "${t}: $($_.Exception.Message)"
              }
            }
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'ludy-signing.pfx'
          if (Test-Path -LiteralPath $pfxPath) {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction Stop
          }
          if ($cleanupErrors.Count -gt 0) {
            Write-Error ("Failed deleting temporary signing certificate(s): " + ($cleanupErrors -join '; '))
            exit 1
          }

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ludy-desktop-signed-win32-x64
          path: apps/desktop/out/installer/
          retention-days: 30
          if-no-files-found: error

  build-mac-signed:
    name: Build, sign, and notarize macOS installers
    needs: prepare
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.mode == 'signed' && needs.prepare.outputs.build_macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    environment: desktop-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install pnpm
        run: npm install -g pnpm@10.34.7 --no-fund --no-audit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@ludy/desktop" --filter "ludy-monorepo"

      # Fail closed early if Apple signing or notarization secrets are missing, partial, malformed, or ambiguous.
      - name: Validate macOS signing and notarization secret presence
        env:
          APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          raw_p12="${APPLE_DEVELOPER_ID_CERT_P12_BASE64:-}"
          raw_pwd="${APPLE_DEVELOPER_ID_CERT_PASSWORD:-}"
          if [ -z "${raw_p12//[[:space:]]/}" ] || [ -z "$raw_pwd" ]; then
            echo "::error::Both APPLE_DEVELOPER_ID_CERT_P12_BASE64 and APPLE_DEVELOPER_ID_CERT_PASSWORD must be set in desktop-release."
            exit 1
          fi
          team_id="$(printf '%s' "${APPLE_TEAM_ID:-}" | tr '[:lower:]' '[:upper:]' | xargs)"
          if ! [[ "$team_id" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_TEAM_ID must be a 10-character alphanumeric Team ID in desktop-release."
            exit 1
          fi

          raw_api_p8="${APPLE_NOTARY_API_KEY_P8_BASE64:-}"
          raw_api_id="${APPLE_NOTARY_API_KEY_ID:-}"
          raw_api_issuer="${APPLE_NOTARY_API_ISSUER_ID:-}"
          raw_apple_id="${APPLE_ID:-}"
          raw_apple_pw="${APPLE_APP_SPECIFIC_PASSWORD:-}"

          has_api_p8=0
          has_api_id=0
          has_api_issuer=0
          [ -n "${raw_api_p8//[[:space:]]/}" ] && has_api_p8=1
          [ -n "${raw_api_id//[[:space:]]/}" ] && has_api_id=1
          [ -n "${raw_api_issuer//[[:space:]]/}" ] && has_api_issuer=1

          has_apple_id=0
          has_apple_pw=0
          [ -n "${raw_apple_id//[[:space:]]/}" ] && has_apple_id=1
          [ -n "$raw_apple_pw" ] && has_apple_pw=1

          any_api=$((has_api_p8 + has_api_id + has_api_issuer))
          any_apple=$((has_apple_id + has_apple_pw))
          if [ "$any_api" -eq 0 ] && [ "$any_apple" -eq 0 ]; then
            echo "::error::Missing Apple notarization secrets in desktop-release. See docs/desktop/mac-signing-runbook.md."
            exit 1
          fi
          if [ "$any_api" -gt 0 ] && [ "$any_apple" -gt 0 ]; then
            echo "::error::Ambiguous Apple notarization secrets: configure either App Store Connect API key or Apple ID credentials, not both."
            exit 1
          fi
          if [ "$any_api" -gt 0 ] && [ "$any_api" -lt 3 ]; then
            echo "::error::APPLE_NOTARY_API_KEY_P8_BASE64, APPLE_NOTARY_API_KEY_ID, and APPLE_NOTARY_API_ISSUER_ID must all be set together."
            exit 1
          fi
          if [ "$any_apple" -gt 0 ] && [ "$any_apple" -lt 2 ]; then
            echo "::error::APPLE_ID and APPLE_APP_SPECIFIC_PASSWORD must both be set together."
            exit 1
          fi

      - name: Typecheck
        run: pnpm --filter "@ludy/desktop" typecheck

      - name: Unit tests
        run: pnpm exec vitest run --project unit apps/desktop

      - name: Stage ephemeral macOS signing certificate and API key
        env:
          APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          p12_file="$RUNNER_TEMP/ludy-apple-devid.p12"
          SECRET_B64="${APPLE_DEVELOPER_ID_CERT_P12_BASE64:-}" node -e 'const fs = require("node:fs"); const buf = Buffer.from((process.env.SECRET_B64 || "").replace(/\s+/g, ""), "base64"); if (buf.length === 0) throw new Error("Empty .p12 certificate payload"); fs.writeFileSync(process.argv[1], buf, { mode: 0o600 });' "$p12_file"
          chmod 600 "$p12_file"
          echo "APPLE_CERT_P12_FILE=$p12_file" >> "$GITHUB_ENV"

          kc_dir="$(mktemp -d "$RUNNER_TEMP/ludy-mac-kc-XXXXXX")"
          chmod 700 "$kc_dir"
          keychain_file="$kc_dir/ephemeral.keychain-db"
          owner_marker="$RUNNER_TEMP/ludy-kc-owner.txt"
          rm -f "$owner_marker"
          echo "LUDY_MAC_EPHEMERAL_KEYCHAIN=$keychain_file" >> "$GITHUB_ENV"
          echo "LUDY_MAC_KEYCHAIN_OWNER_MARKER=$owner_marker" >> "$GITHUB_ENV"

          raw_api_p8="${APPLE_NOTARY_API_KEY_P8_BASE64:-}"
          if [ -n "${raw_api_p8//[[:space:]]/}" ]; then
            p8_file="$RUNNER_TEMP/ludy-notary-key.p8"
            SECRET_B64="$raw_api_p8" node -e 'const fs = require("node:fs"); const buf = Buffer.from((process.env.SECRET_B64 || "").replace(/\s+/g, ""), "base64"); if (buf.length === 0) throw new Error("Empty .p8 key payload"); fs.writeFileSync(process.argv[1], buf, { mode: 0o600 });' "$p8_file"
            chmod 600 "$p8_file"
            echo "APPLE_API_KEY_FILE=$p8_file" >> "$GITHUB_ENV"
          fi

      - name: Build, sign, notarize, and staple macOS installers (arm64 and x64)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: node apps/desktop/scripts/package-mac.mjs --version "$VERSION" --arch all --sign

      - name: Verify signed macOS manifests, checksums, and Gatekeeper
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          team_id="$(printf '%s' "$APPLE_TEAM_ID" | tr '[:lower:]' '[:upper:]' | xargs)"
          {
            echo "### Ludy Desktop signed and notarized release (macOS)"
            echo ""
            echo "| arch | installer | sha256 | teamId |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for arch in arm64 x64; do
            arch_dir="apps/desktop/out/mac/darwin-$arch"
            dmg="LudyDesktop-${VERSION}-darwin-${arch}.dmg"
            zip="LudyDesktop-${VERSION}-darwin-${arch}.zip"
            [ -s "$arch_dir/$dmg" ] || { echo "::error::missing $dmg"; exit 1; }
            [ -s "$arch_dir/$zip" ] || { echo "::error::missing $zip"; exit 1; }
            [ -s "$arch_dir/release-manifest.json" ] || { echo "::error::missing release-manifest.json"; exit 1; }
            [ -s "$arch_dir/SHA256SUMS.txt" ] || { echo "::error::missing SHA256SUMS.txt"; exit 1; }

            (cd "$arch_dir" && shasum -a 256 -c SHA256SUMS.txt)
            xcrun stapler validate "$arch_dir/$dmg"
            spctl -a -t open --context context:primary-signature -vv "$arch_dir/$dmg"
            dmg_sha="$(node -e '
              const fs = require("node:fs");
              const m = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (m.version !== process.argv[2] || m.platform !== "darwin" || m.arch !== process.argv[3] || m.signed !== true) {
                throw new Error("Invalid signed macOS manifest: " + JSON.stringify(m));
              }
              if (!m.signing.hardenedRuntime || !m.signing.notarized || m.signing.teamId !== process.argv[4] || m.signing.bundleId !== "vn.ludy.desktop") {
                throw new Error("Invalid macOS signing fields in manifest: " + JSON.stringify(m.signing));
              }
              console.log(m.installer.sha256);
            ' "$arch_dir/release-manifest.json" "$VERSION" "$arch" "$team_id")"
            echo "| $arch | \`$dmg\` | \`$dmg_sha\` | \`$team_id\` |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Clean up ephemeral macOS signing credentials and Keychain
        if: always()
        run: |
          set -euo pipefail
          cleanup_failed=0
          owned_kc=''
          if [ -n "${LUDY_MAC_KEYCHAIN_OWNER_MARKER:-}" ] && [ -s "$LUDY_MAC_KEYCHAIN_OWNER_MARKER" ]; then
            owned_kc="$(cat "$LUDY_MAC_KEYCHAIN_OWNER_MARKER")"
          fi
          if [ -n "${LUDY_MAC_EPHEMERAL_KEYCHAIN:-}" ] && [ "$owned_kc" = "$LUDY_MAC_EPHEMERAL_KEYCHAIN" ]; then
            if [ -e "$LUDY_MAC_EPHEMERAL_KEYCHAIN" ]; then
              security delete-keychain "$LUDY_MAC_EPHEMERAL_KEYCHAIN" || cleanup_failed=1
              rm -f "$LUDY_MAC_EPHEMERAL_KEYCHAIN" || cleanup_failed=1
            fi
            if security list-keychains -d user | grep -F -q "$LUDY_MAC_EPHEMERAL_KEYCHAIN"; then
              echo "::error::Ephemeral Keychain remained in search list: $LUDY_MAC_EPHEMERAL_KEYCHAIN"
              cleanup_failed=1
            fi
            if [ -e "$LUDY_MAC_EPHEMERAL_KEYCHAIN" ]; then
              echo "::error::Ephemeral Keychain file remained on disk: $LUDY_MAC_EPHEMERAL_KEYCHAIN"
              cleanup_failed=1
            fi
            rmdir "$(dirname "$LUDY_MAC_EPHEMERAL_KEYCHAIN")" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/ludy-kc-owner.txt" || true
          for temp_secret in "$RUNNER_TEMP/ludy-apple-devid.p12" "$RUNNER_TEMP/ludy-notary-key.p8"; do
            if [ -e "$temp_secret" ]; then
              rm -f "$temp_secret" || cleanup_failed=1
            fi
            if [ -e "$temp_secret" ]; then
              echo "::error::Temporary Apple credential file remained on disk: $temp_secret"
              cleanup_failed=1
            fi
          done
          if [ "$cleanup_failed" -ne 0 ]; then
            exit 1
          fi

      - name: Upload signed macOS release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ludy-desktop-signed-darwin
          path: apps/desktop/out/mac/
          retention-days: 30
          if-no-files-found: error

  release:
    name: Create draft GitHub release for signed desktop artifacts
    needs: [prepare, build-signed, build-mac-signed]
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.prepare.result == 'success' && needs.prepare.outputs.mode == 'signed' && needs.prepare.outputs.tag != '' && !cancelled() && (needs.build-signed.result == 'success' || needs.build-signed.result == 'skipped') && (needs.build-mac-signed.result == 'success' || needs.build-mac-signed.result == 'skipped') && (needs.build-signed.result == 'success' || needs.build-mac-signed.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      # Holds contents:write with zero repo checkout; verifies SHA256SUMS.txt and re-verifies tag SHA before staging a draft release.
      - name: Download signed Windows release artifacts
        if: needs.prepare.outputs.build_windows == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --repo "$REPO" --name ludy-desktop-signed-win32-x64 --dir "$RUNNER_TEMP/desktop-release-win"

      - name: Download signed macOS release artifacts
        if: needs.prepare.outputs.build_macos == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --repo "$REPO" --name ludy-desktop-signed-darwin --dir "$RUNNER_TEMP/desktop-release-mac"

      - name: Verify checksums and create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_WINDOWS: ${{ needs.prepare.outputs.build_windows }}
          BUILD_MACOS: ${{ needs.prepare.outputs.build_macos }}
        run: |
          set -euo pipefail
          stage_dir="$RUNNER_TEMP/desktop-release"
          mkdir -p "$stage_dir"
          files=()

          if [ "$BUILD_WINDOWS" = 'true' ]; then
            (cd "$RUNNER_TEMP/desktop-release-win" && sha256sum --check SHA256SUMS.txt)
            cp "$RUNNER_TEMP/desktop-release-win/"* "$stage_dir/"
            for f in LudyDesktop-Setup.exe RELEASES release-manifest.json release-manifest.ps1 SHA256SUMS.txt; do
              files+=("$f")
            done
            for nupkg in "$stage_dir/"*.nupkg; do
              files+=("$(basename "$nupkg")")
            done
          fi

          if [ "$BUILD_MACOS" = 'true' ]; then
            for arch in arm64 x64; do
              mac_dir="$RUNNER_TEMP/desktop-release-mac/darwin-$arch"
              (cd "$mac_dir" && sha256sum --check SHA256SUMS.txt)
              dmg="LudyDesktop-${VERSION}-darwin-${arch}.dmg"
              zip="LudyDesktop-${VERSION}-darwin-${arch}.zip"
              manifest="release-manifest-darwin-${arch}.json"
              sums="SHA256SUMS-darwin-${arch}.txt"
              cp "$mac_dir/$dmg" "$stage_dir/$dmg"
              cp "$mac_dir/$zip" "$stage_dir/$zip"
              cp "$mac_dir/release-manifest.json" "$stage_dir/$manifest"
              (cd "$stage_dir" && sha256sum "$dmg" "$zip" "$manifest" > "$sums")
              files+=("$dmg" "$zip" "$manifest" "$sums")
            done
          fi

          cd "$stage_dir"
          tag_ref_json="$(gh api "repos/$REPO/git/ref/tags/$TAG")"
          obj_type="$(jq -r '.object.type' <<<"$tag_ref_json")"
          obj_sha="$(jq -r '.object.sha' <<<"$tag_ref_json")"
          if [ "$obj_type" = 'tag' ]; then
            live_sha="$(gh api "repos/$REPO/git/tags/$obj_sha" --jq '.object.sha')"
          else
            live_sha="$obj_sha"
          fi
          if [ "$live_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Tag $TAG moved from validated commit $EXPECTED_SHA to $live_sha; aborting draft release"
            exit 1
          fi
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "::error::$TAG already has a GitHub release; refusing to overwrite"
            exit 1
          fi
          {
            echo "Ludy Desktop $VERSION signed desktop release."
            echo
            echo "Draft release created after code-signing, timestamp, and notarization checks. Complete the clean machine install and A-to-B update verification (docs/desktop/windows-smoke.md, docs/desktop/mac-signing-runbook.md), upload the platform feed files to your HTTPS feed host, then publish this release."
            echo
            if [ "$BUILD_WINDOWS" = 'true' ]; then
              echo "Windows SHA-256 checksums:"
              echo '```'
              cat SHA256SUMS.txt
              echo '```'
            fi
            if [ "$BUILD_MACOS" = 'true' ]; then
              for arch in arm64 x64; do
                echo "macOS ($arch) SHA-256 checksums:"
                echo '```'
                cat "SHA256SUMS-darwin-${arch}.txt"
                echo '```'
              done
            fi
          } > notes.md
          gh release create "$TAG" --repo "$REPO" --draft --verify-tag --latest=false --title "Desktop $VERSION" --notes-file notes.md "${files[@]}"
