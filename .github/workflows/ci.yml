name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The checks run in parallel jobs (#1041): lint, typecheck and unit tests here, the database tests in `db` split in
  # eight balanced shards plus a heavy-files job, and `check` below, the required "Lint, typecheck, test", passes only when every one of them passed.
  static:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    # 25 minutes (#3995): successful runs take 8 to 14 minutes, and the 15-minute limit cancelled unrelated PRs mid-typecheck.
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: ci-postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      LUDY_TEST_ADMIN_URL: postgres://postgres:ci-postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install pnpm
        run: npm install -g pnpm@10.34.7 --no-fund --no-audit

      # Every module, also one the kernel does not import yet: typecheck and unit tests run over all of them, and the
      # marketing site, which pnpm typecheck covers with its tests (#1629).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@ludy/kernel-server..." --filter "@ludy/app..." --filter "./modules/*" --filter "@ludy/e2e" --filter "@ludy/web" --filter "@ludy/extension" --filter "@ludy/desktop" --filter "@ludy/mobile" --filter "@ludy/media..." --filter "ludy-monorepo"

      - name: Lint
        run: pnpm lint

      # The module DAG from the manifests' dependsOn, no deep imports past a package's exports, a pure domain/ and an app
      # that reaches no server code (G5, #1651); the rules are generated in tools/depcruise-rules.mjs.
      - name: Dependency rules (dependency-cruiser)
        run: pnpm depcruise

      # The deploy script runs on the production host (issue #56); the test stand-ins are bash too.
      - name: Shell scripts (shellcheck)
        run: shellcheck tools/deploy/deploy.sh tools/test/deploy-stubs/docker tools/test/deploy-stubs/curl tools/test/deploy-stubs/openssl

      # One package at a time (`pnpm -r --workspace-concurrency=1` in the root script, #4023): the `tsc` of apps/kernel and
      # apps/app are each several GB, so two of them together (or four module checks, 14 GB) exhausted the runner's 16 GB
      # and it was killed ("The runner has received a shutdown signal"), on about one run in three. One at a time the
      # machine peaks at about 14.6 GB used while apps/kernel is checked (apps/app: 8 GB), so the headroom is thin
      # (#4062) and this must not go back to parallel. It takes about the same time (4 to 5 minutes). The step limit
      # makes a stall fail here, by name, instead of using up the job's 25 minutes.
      - name: Typecheck
        timeout-minutes: 12
        run: pnpm typecheck

      # The Kysely types generated from the migrated database (issue #48): a migration that changes a table the
      # tenant role reads commits the regenerated file with it.
      - name: Generated database types are current
        run: |
          pnpm db:types
          if [ -n "$(git status --porcelain -- packages/db/src/generated)" ]; then
            git status --short -- packages/db/src/generated
            git diff -- packages/db/src/generated
            echo "::error::packages/db/src/generated is out of date. Run 'pnpm db:types' (needs LUDY_TEST_ADMIN_URL) and commit the result."
            exit 1
          fi

      # S3-compatible server for the S3BlobStore integration tests (External-tenant gate T7). minio/minio is no
      # longer published on Docker Hub; pgsty/minio is a community build of the same server, pinned by digest.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 -e MINIO_ROOT_USER=ludy-ci -e MINIO_ROOT_PASSWORD=ludy-ci-minio \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data
          curl --silent --fail --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:9000/minio/health/live

      - name: Unit tests (S3 tests against MinIO)
        env:
          LUDY_TEST_S3_URL: http://ludy-ci:ludy-ci-minio@127.0.0.1:9000/ludy-test
        run: pnpm exec vitest run --project unit

      - name: Build web app
        run: pnpm --filter @ludy/app build

      # Kernel plan §9 (#1518): every browser downloads the SPA, so no kernel secret name used as code and no
      # secret-shaped value may be in the build.
      - name: No kernel secret in the web app build
        run: node tools/ci/spa-secrets.mjs apps/app/dist apps/kernel/src/config.ts

  # The database tests run one file at a time (fileParallelism: false) and took 17 minutes in one job (#1041). Two
  # files take 44% of that (finance-search on 50,000 documents, about 260 s; archive, about 150 s), so they run in a
  # job of their own and every other file in eight shards, each job on its own PostgreSQL. A renamed heavy file fails the
  # heavy job (no test files found) until this list follows it.
  # The shards are balanced by measured file time (tools/ci/db-shards.mjs, times in tools/ci/db-test-times.json), not by
  # file name as vitest's --shard does: the two name-based halves ran 13 and 19 minutes against the 20-minute timeout
  # (#2769). Every file is in exactly one shard (tools/test/db-shards.test.ts). Each job prints its planned and actual
  # duration in its summary.
  db:
    name: Database tests (${{ matrix.part.name }})
    runs-on: ubuntu-latest
    # Eight balanced shards (#3756) keep every job well under the 30-minute limit.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part:
          - name: heavy files
            shard: ''
            exclude: ''
          - name: shard 1 of 8
            shard: '1'
            exclude: apps/kernel/test/finance-search.db.test.ts,apps/kernel/test/archive.db.test.ts
          - name: shard 2 of 8
            shard: '2'
            exclude: apps/kernel/test/finance-search.db.test.ts,apps/kernel/test/archive.db.test.ts
          - name: shard 3 of 8
            shard: '3'
            exclude: apps/kernel/test/finance-search.db.test.ts,apps/kernel/test/archive.db.test.ts
          - name: shard 4 of 8
            shard: '4'
            exclude: apps/kernel/test/finance-search.db.test.ts,apps/kernel/test/archive.db.test.ts
          - name: shard 5 of 8
            shard: '5'
            exclude: apps/kernel/test/finance-search.db.test.ts,apps/kernel/test/archive.db.test.ts
          - name: shard 6 of 8
            shard: '6'
            exclude: apps/kernel/test/finance-search.db.test.ts,apps/kernel/test/archive.db.test.ts
          - name: shard 7 of 8
            shard: '7'
            exclude: apps/kernel/test/finance-search.db.test.ts,apps/kernel/test/archive.db.test.ts
          - name: shard 8 of 8
            shard: '8'
            exclude: apps/kernel/test/finance-search.db.test.ts,apps/kernel/test/archive.db.test.ts
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: ci-postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      LUDY_TEST_ADMIN_URL: postgres://postgres:ci-postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install pnpm
        run: npm install -g pnpm@10.34.7 --no-fund --no-audit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@ludy/kernel-server..." --filter "@ludy/app..." --filter "./modules/*" --filter "@ludy/e2e" --filter "ludy-monorepo"

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 -e MINIO_ROOT_USER=ludy-ci -e MINIO_ROOT_PASSWORD=ludy-ci-minio \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data
          curl --silent --fail --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:9000/minio/health/live

      # The staged upload tests (#109) run on MinIO too: the database decides single use, the bucket holds the bytes.
      - name: Database tests (PostgreSQL 17, S3 tests against MinIO)
        env:
          LUDY_TEST_S3_URL: http://ludy-ci:ludy-ci-minio@127.0.0.1:9000/ludy-test
          PART_SHARD: ${{ matrix.part.shard }}
          # Read by vitest.config.ts: the files another part runs (vitest's --exclude does not reach a project).
          LUDY_DB_TEST_EXCLUDE: ${{ matrix.part.exclude }}
        run: |
          echo "DB_PART_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          if [ -z "$PART_SHARD" ]; then
            files=(apps/kernel/test/finance-search.db.test.ts apps/kernel/test/archive.db.test.ts)
          else
            mapfile -t files < <(node tools/ci/db-shards.mjs "$PART_SHARD" 8)
          fi
          echo "Running ${#files[@]} database test files"
          pnpm exec vitest run --project db "${files[@]}"

      # Planned against actual time, so an imbalance shows in the summary before it reaches the timeout (#2769).
      - name: Duration of this part
        if: always()
        env:
          PART_NAME: ${{ matrix.part.name }}
          PART_SHARD: ${{ matrix.part.shard }}
        run: |
          started="${DB_PART_STARTED:-}"
          [ -n "$started" ] || exit 0
          elapsed=$(( $(date +%s) - started ))
          planned="n/a"
          if [ -n "$PART_SHARD" ]; then
            planned=$(node tools/ci/db-shards.mjs --plan 8 | awk -F'|' -v n="$PART_SHARD" '$2 ~ "^ "n" of" { gsub(/ /, "", $4); print $4 "s" }')
          fi
          printf '%s: tests ran %dm%02ds (planned file time %s, job timeout 30m)\n' "$PART_NAME" $((elapsed / 60)) $((elapsed % 60)) "$planned" >> "$GITHUB_STEP_SUMMARY"

  # The core invariants with LUDY_SHARED_DATABASE=true (#2284): the same migrations in shared-database mode, where PUBLIC keeps
  # TEMPORARY. The cross-org RLS matrix, the EXECUTE matrix of the login roles and the definer search_path hijack test (all in
  # these two files) must hold there too, with temporary objects available. The one test that asserts the login roles have no
  # temporary schema is the owned database's property and is the one left out.
  shared-mode-invariants:
    name: Core invariants in shared-database mode
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: ci-postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      LUDY_TEST_ADMIN_URL: postgres://postgres:ci-postgres@localhost:5432/postgres
      LUDY_SHARED_DATABASE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install pnpm
        run: npm install -g pnpm@10.34.7 --no-fund --no-audit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@ludy/kernel-server..." --filter "ludy-monorepo"

      - name: RLS matrix, EXECUTE matrix and search_path hijack test, shared mode
        run: >-
          pnpm exec vitest run --project db
          apps/kernel/test/invariant/rls-matrix.db.test.ts apps/kernel/test/invariant/kernel-invariants.db.test.ts
          -t '^(?!.*gives the login roles no temporary schema)'

  # Unused files, exports and dependencies, and dependencies used but not listed (knip, G5, #1602), over every workspace
  # package, the marketing site included: its own job, with the whole workspace installed.
  knip:
    name: Unused files, exports and dependencies (knip)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install pnpm
        run: npm install -g pnpm@10.34.7 --no-fund --no-audit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: knip
        run: pnpm knip

  # The marketing site (#1629; DESIGN.md §7, §8, §10): its production image, built and started as it ships, then axe
  # (WCAG 2.2 AA, landmarks and headings) on / and /en in both themes at 360px and on a desktop, no sideways scroll, and
  # no Vietnamese on the English page but the allowed example names. Then its performance budget (#1655, DESIGN.md
  # §6.3): LCP, CLS and INP on a throttled phone and a desktop, fonts, raster images and client scripts, with the
  # planted faults the budget must catch. The image build downloads the fonts.
  # Split into four parallel jobs (#4081): axe/language on its own runner and the single-worker performance budget
  # across three shards, so each part finishes in ~4 to 6 minutes instead of running 17 to 19+ minutes against the
  # 20-minute limit.
  web:
    name: Marketing site (${{ matrix.part.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part:
          - name: axe and language
            suite: a11y
            shard: ''
            artifact: a11y
          - name: performance 1 of 3
            suite: perf
            shard: '1/3'
            artifact: perf-1-of-3
          - name: performance 2 of 3
            suite: perf
            shard: '2/3'
            artifact: perf-2-of-3
          - name: performance 3 of 3
            suite: perf
            shard: '3/3'
            artifact: perf-3-of-3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install pnpm
        run: npm install -g pnpm@10.34.7 --no-fund --no-audit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@ludy/web"

      - name: Build the apps/web image
        run: docker build -f apps/web/Dockerfile -t ludy-web:ci .

      - name: Start it on the loopback interface
        run: |
          docker run -d --name ludy-web -p 127.0.0.1:3000:3000 ludy-web:ci
          curl --silent --fail --output /dev/null --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:3000/

      - name: Install Chromium
        run: pnpm --filter @ludy/web exec playwright install --with-deps chromium

      - name: axe and language checks
        if: matrix.part.suite == 'a11y'
        env:
          WEB_BASE_URL: http://127.0.0.1:3000
        run: pnpm --filter @ludy/web test:a11y

      # Each shard runs with one worker on its own runner, so nothing else competes for the CPU it measures.
      - name: Performance budget
        if: matrix.part.suite == 'perf'
        env:
          WEB_BASE_URL: http://127.0.0.1:3000
          PERF_SHARD: ${{ matrix.part.shard }}
        run: pnpm --filter @ludy/web exec playwright test --project=perf --workers=1 --shard="$PERF_SHARD"

      - name: Server log
        if: failure()
        run: docker logs ludy-web

      - name: Traces of the failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-playwright-traces-${{ matrix.part.artifact }}
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The Ludy browser extension (#2583; ADR-0047 point 10): built as the store package would be (no bundler, no runtime
  # dependency), its manifest checked against the fixed permission list of plan section 5.7, then loaded unpacked in
  # Chromium against a fake Ludy server with fake media devices. A release is the same build with `--version` from a
  # tag (`node scripts/build.mjs --version 1.2.3`); nothing is published from here.
  extension:
    name: Browser extension (build, manifest permissions, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install pnpm
        run: npm install -g pnpm@10.34.7 --no-fund --no-audit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@ludy/extension..."

      - name: Build the package
        run: pnpm --filter @ludy/extension build

      - name: Manifest permissions match the fixed list
        run: pnpm --filter @ludy/extension check:manifest

      - name: Install Chromium
        run: pnpm --filter @ludy/extension exec playwright install --with-deps chromium

      - name: Load the unpacked extension in Chromium
        run: pnpm --filter @ludy/extension test:e2e -- --trace off

  # The required check: it passes only when the static job, knip, the marketing site, the extension, every database part, the shared-database
  # invariants, the Supabase image (T17), the kernel, extract and media images (T12), the split stack (T7) and the backup drill passed, so a
  # failed, cancelled or skipped part fails it (#3974: before, a red T12 or T17 job blocked neither a merge nor a release).
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [static, knip, web, db, shared-mode-invariants, supabase-stack, kernel-image, extract-image, media-image, split-stack, backup-drill, extension, mcp-conformance]
    if: always()
    steps:
      - name: Every part passed
        env:
          STATIC: ${{ needs.static.result }}
          KNIP: ${{ needs.knip.result }}
          WEB: ${{ needs.web.result }}
          DB: ${{ needs.db.result }}
          MEDIA: ${{ needs.media-image.result }}
          EXTENSION: ${{ needs.extension.result }}
          SHARED: ${{ needs.shared-mode-invariants.result }}
          SUPABASE: ${{ needs.supabase-stack.result }}
          KERNEL: ${{ needs.kernel-image.result }}
          EXTRACT: ${{ needs.extract-image.result }}
          SPLIT: ${{ needs.split-stack.result }}
          BACKUP: ${{ needs.backup-drill.result }}
          MCP: ${{ needs.mcp-conformance.result }}
        run: |
          echo "static: $STATIC, knip: $KNIP, marketing site: $WEB, database tests: $DB, media: $MEDIA, extension: $EXTENSION"
          echo "shared-mode invariants: $SHARED, Supabase image: $SUPABASE, kernel image: $KERNEL, extract image: $EXTRACT, split stack: $SPLIT, backup drill: $BACKUP, MCP conformance: $MCP"
          for result in "$STATIC" "$KNIP" "$WEB" "$DB" "$MEDIA" "$EXTENSION" "$SHARED" "$SUPABASE" "$KERNEL" "$EXTRACT" "$SPLIT" "$BACKUP" "$MCP"; do
            test "$result" = success
          done

  # The migrations and the definer hardening guard (External-tenant gate T17) on the Supabase Postgres image that
  # hosted Supabase runs (issue #179): its extensions, its roles and the supautils hooks, with migrations run as
  # `postgres`, which is not a superuser there. Nothing here touches a hosted project.
  supabase-stack:
    name: Migrations and hardening guard on the Supabase Postgres image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      supabase-db:
        image: supabase/postgres:17.11.0.002@sha256:0450166354dc9c1d25f0322ac8b580774d4fb0184d2b087f6e4fe9499c66cf53
        env:
          POSTGRES_PASSWORD: ci-supabase
        ports: ['5432:5432']
        # TCP, so the check waits for the server that starts after the image's init scripts, not the one they run on.
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1" --health-interval 2s --health-timeout 3s --health-retries 60
    env:
      SUPABASE_DB_URL: postgres://postgres:ci-supabase@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install pnpm
        run: npm install -g pnpm@10.34.7 --no-fund --no-audit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@ludy/kernel-server..." --filter "ludy-monorepo"

      - name: Migrate with the extensions enabled and run the guard (as postgres, not a superuser)
        env:
          LUDY_TEST_SUPABASE_URL: ${{ env.SUPABASE_DB_URL }}
          LUDY_REQUIRE_SUPABASE_TEST: "1"
        run: pnpm exec vitest run --project db packages/db/test/supabase.db.test.ts

      # Shared-database mode (#2284): Ludy migrated beside another system's schema, role and default privileges, in a database
      # of its own in the same container; the other system keeps its privileges and raises no DDL alert.
      - name: Shared-database mode beside a foreign schema and role
        env:
          LUDY_TEST_SUPABASE_URL: ${{ env.SUPABASE_DB_URL }}
          LUDY_REQUIRE_SUPABASE_TEST: "1"
        run: pnpm exec vitest run --project db packages/db/test/shared-database.db.test.ts

      - name: The kernel migrate role, twice, so the guard also checks pg-boss's ludy_jobs schema
        env:
          DATABASE_URL: ${{ env.SUPABASE_DB_URL }}
          ADMIN_DATABASE_URL: ${{ env.SUPABASE_DB_URL }}
          # Required by the configuration check only; migrate never calls them.
          AUTH_ISSUER: http://127.0.0.1:9999/auth/v1
          AUTH_JWKS_URL: http://127.0.0.1:9999/auth/v1/.well-known/jwks.json
        run: |
          node apps/kernel/src/main.ts migrate
          node apps/kernel/src/main.ts migrate

  # The kernel image (External-tenant gate T12): it builds, every kernel module loads, the entry point starts, and
  # no PDF, XML or MIME parser package is anywhere in it.
  kernel-image:
    name: Kernel image (boots, no parser packages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      IMAGE: ludy:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the kernel image
        run: |
          built_at="$(git show -s --format=%cI "$GITHUB_SHA")"
          test -n "$built_at"
          docker build --build-arg "LUDY_BUILD=$GITHUB_SHA" --build-arg "LUDY_BUILD_TIME=$built_at" -t "$IMAGE" .

      # GET /version reports LUDY_BUILD (#892), and LUDY_BUILD_TIME orders builds for /readyz (#1952): both build
      # arguments reach the running image.
      - name: The image carries its build id and time
        run: |
          test "$(docker run --rm --entrypoint printenv "$IMAGE" LUDY_BUILD)" = "$GITHUB_SHA"
          built_at="$(git show -s --format=%cI "$GITHUB_SHA")"
          test -n "$built_at"
          test "$(docker run --rm --entrypoint printenv "$IMAGE" LUDY_BUILD_TIME)" = "$built_at"

      - name: Modules load and no parser package is in the image
        run: |
          docker run --rm --read-only -v "$PWD/apps/kernel/test/container:/c:ro" --entrypoint node "$IMAGE" /c/image-check.mjs /app

      # Control runs (#1719, #1740): with a parser planted where each part of the check looks, the check must fail
      # and name it on a line of its own, so a part that stopped looking cannot pass: pnpm's hidden hoisting
      # directory, a store entry and a scoped one (which only the store-entry check reads), a dangling link a store
      # entry holds (which only the per-entry walk reads), a package of a scope on the list, parser code in a .cjs
      # file of an excepted package outside its excepted files, parser code in the workspace's own code, a
      # WebAssembly module under another name and one inlined in base64, a pinned file gone and one changed (#1770),
      # a test file, a test directory, the end-to-end suite and tooling. Each runs in a fresh container of the image.
      - name: The check fails on each planted parser
        run: |
          # As root: /app itself is root's (the image's WORKDIR), so the node user cannot plant at its top level.
          planted() {
            if docker run --rm --user 0 -v "$PWD/apps/kernel/test/container:/c:ro" --entrypoint sh "$IMAGE" -c \
              "$1 && node /c/image-check.mjs /app" > planted.txt 2>&1; then
              cat planted.txt; echo "::error::the image check passed after: $1"; exit 1
            fi
            cat planted.txt
            grep -qxE "$2" planted.txt || { echo "::error::the image check did not name what this planted: $1"; exit 1; }
          }
          planted 'mkdir -p /app/node_modules/.pnpm/node_modules/saxes' \
            'parser package in the image: /app/node_modules/\.pnpm/node_modules/saxes'
          planted 'mkdir /app/node_modules/.pnpm/saxes@6.0.0' \
            'parser package in the image: saxes@6\.0\.0'
          planted 'mkdir /app/node_modules/.pnpm/@oozcitak+dom@1.0.0' \
            'parser package in the image: @oozcitak\+dom@1\.0\.0'
          planted 'for d in /app/node_modules/.pnpm/exceljs@*/node_modules; do ln -s /nowhere "$d/saxes"; done' \
            'parser package in the image: /app/node_modules/\.pnpm/exceljs@[^/]+/node_modules/saxes'
          planted 'mkdir -p /app/node_modules/.pnpm/node_modules/@oozcitak/dom' \
            'parser package in the image: /app/node_modules/\.pnpm/node_modules/@oozcitak/dom'
          planted 'for d in /app/node_modules/.pnpm/@aws-sdk+core@*/node_modules/@aws-sdk/core; do echo "module.exports = function parseXML(s) { return s; };" > "$d/planted.cjs"; done' \
            'parser code in the image, in @aws-sdk/core: /app/node_modules/\.pnpm/@aws-sdk\+core@[^/]+/node_modules/@aws-sdk/core/planted\.cjs \(function parseXML\)'
          planted 'echo "export function parsePdf(s) { return s; }" > /app/packages/db/src/planted.ts' \
            'parser code in the image, outside node_modules: /app/packages/db/src/planted\.ts \(function parsePdf\)'
          planted 'for d in /app/node_modules/.pnpm/pg@*/node_modules/pg; do printf "\000asm\001\000\000\000" > "$d/engine.bin"; done' \
            'native or WebAssembly module in the image: /app/node_modules/\.pnpm/pg@[^/]+/node_modules/pg/engine\.bin'
          planted 'echo "export const engine = \"AGFzbQEAAAA=\";" > /app/packages/db/src/engine.ts' \
            'native or WebAssembly module inlined in the image: /app/packages/db/src/engine\.ts'
          planted 'rm /app/node_modules/.pnpm/undici@*/node_modules/undici/lib/web/fetch/formdata-parser.js' \
            'the pinned file undici/lib/web/fetch/formdata-parser\.js is not in the image any more: update PINNED'
          planted 'for f in /app/node_modules/.pnpm/undici@*/node_modules/undici/lib/web/fetch/formdata-parser.js; do echo "// changed" >> "$f"; done' \
            'the pinned file undici/lib/web/fetch/formdata-parser\.js changed \(now undici@[^,]+, sha256 [0-9a-f]{64}; pinned [^)]+\): read the new file, then pin it again in PINNED'
          planted 'echo "export {};" > /app/packages/db/src/planted.test.ts' \
            'a test file is in the image: /app/packages/db/src/planted\.test\.ts'
          planted 'mkdir /app/e2e' \
            'the end-to-end suite is in the image: /app/e2e'
          planted 'mkdir /app/packages/db/test' \
            'a test directory is in the image: /app/packages/db/test'
          planted 'mkdir -p /app/tools/ci' \
            'tooling is in the image: /app/tools/ci'

      - name: The entry point starts and stops at the missing configuration
        run: |
          # Without DATABASE_URL the migrate role exits after every module of main.ts has loaded.
          if docker run --rm "$IMAGE" migrate > boot.txt 2>&1; then
            cat boot.txt; echo "::error::the kernel started without a database configuration"; exit 1
          fi
          cat boot.txt
          grep -q 'invalid configuration: DATABASE_URL' boot.txt

  # The ludy-extract image as compose runs it (External-tenant gate T12): files are parsed inside the real
  # container (the image's pnpm layout under the parser process's permission model), the service refuses an
  # environment outside its allowlist, and nothing inside it reaches the outside.
  extract-image:
    name: ludy-extract image (parse in the container, no egress)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      IMAGE: ludy-extract:ci
      NET: ludy-extract-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the ludy-extract image
        run: docker build -f apps/extract/Dockerfile -t "$IMAGE" .

      - name: Refuses to start with a variable outside its allowlist, whatever NODE_ENV says
        run: |
          # The image marker keeps the allowlist on even when NODE_ENV is overridden to development, test or empty.
          for node_env in production development test ''; do
            if docker run --rm -e NODE_ENV="$node_env" -e EXTRA_SETTING=1 "$IMAGE" > refused.txt 2>&1; then
              cat refused.txt; echo "::error::ludy-extract started with EXTRA_SETTING (NODE_ENV='$node_env')"; exit 1
            fi
            cat refused.txt
            grep -q 'remove EXTRA_SETTING' refused.txt
          done

      - name: Start it as compose does, on an internal network
        run: |
          docker network create --internal "$NET"
          docker run -d --name ludy-extract --network "$NET" --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 1g --memory-swap 1g --cpus 1 --pids-limit 128 "$IMAGE"
          for i in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' ludy-extract)" = healthy ]; then exit 0; fi
            sleep 1
          done
          docker logs ludy-extract
          echo "::error::ludy-extract did not become healthy"; exit 1

      - name: Parse files inside the real container
        run: |
          docker run --rm --network "$NET" --read-only --cap-drop ALL -v "$PWD/apps/extract/test:/t:ro" \
            --entrypoint node "$IMAGE" /t/container/smoke.mjs http://ludy-extract:8090 /t/fixtures

      - name: No egress from the container
        run: |
          # In the network namespace of the running service: every probe must fail.
          docker run --rm --network container:ludy-extract -v "$PWD/apps/extract/test:/t:ro" \
            --entrypoint node "$IMAGE" /t/container/egress.mjs blocked
          # Control on an ordinary network: the same probes succeed, so the check above is not vacuous.
          docker run --rm -v "$PWD/apps/extract/test:/t:ro" --entrypoint node "$IMAGE" /t/container/egress.mjs control

      - name: Service log and cleanup
        if: always()
        run: |
          docker logs ludy-extract || true
          docker rm -f ludy-extract || true
          docker network rm "$NET" || true

  # The ludy-media image as compose runs it (AI Meeting Notes M3, #2577, ADR-0047): audio and video are
  # normalized, probed and split inside the container with ffmpeg, the service refuses an environment outside
  # its allowlist, and nothing inside it reaches the outside.
  media-image:
    name: ludy-media image (process in the container, no egress)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      IMAGE: ludy-media:ci
      NET: ludy-media-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the ludy-media image
        run: docker build -f apps/media/Dockerfile -t "$IMAGE" .

      - name: Refuses to start with a variable outside its allowlist, whatever NODE_ENV says
        run: |
          for node_env in production development test ''; do
            if docker run --rm -e NODE_ENV="$node_env" -e EXTRA_SETTING=1 "$IMAGE" > refused.txt 2>&1; then
              cat refused.txt; echo "::error::ludy-media started with EXTRA_SETTING (NODE_ENV='$node_env')"; exit 1
            fi
            cat refused.txt
            grep -q 'remove EXTRA_SETTING' refused.txt
          done

      - name: Start it as compose does, on an internal network
        run: |
          docker network create --internal "$NET"
          docker run -d --name ludy-media --network "$NET" --read-only --tmpfs /tmp:size=64m,noexec,nosuid \
            --tmpfs /data/scratch:rw,noexec,nosuid,uid=1000,gid=1000,mode=0700,size=512m --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 2g --memory-swap 2g --cpus 1 --pids-limit 128 "$IMAGE"
          for i in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' ludy-media)" = healthy ]; then exit 0; fi
            sleep 1
          done
          docker logs ludy-media
          echo "::error::ludy-media did not become healthy"; exit 1

      - name: Process media inside the real container
        run: |
          docker run --rm --network "$NET" --read-only --tmpfs /tmp:size=64m,noexec,nosuid \
            --tmpfs /data/scratch:rw,noexec,nosuid,uid=1000,gid=1000,mode=0700,size=512m --cap-drop ALL -v "$PWD/apps/media/test:/t:ro" \
            --entrypoint node "$IMAGE" /t/container/smoke.mjs http://ludy-media:8095

      - name: No egress from the container
        run: |
          # In the network namespace of the running service: every probe must fail.
          docker run --rm --network container:ludy-media -v "$PWD/apps/media/test:/t:ro" \
            --entrypoint node "$IMAGE" /t/container/egress.mjs blocked
          # Control on an ordinary network: the same probes succeed, so the check above is not vacuous.
          docker run --rm -v "$PWD/apps/media/test:/t:ro" --entrypoint node "$IMAGE" /t/container/egress.mjs control

      - name: Service log and cleanup
        if: always()
        run: |
          docker logs ludy-media || true
          docker rm -f ludy-media || true
          docker network rm "$NET" || true

  # External-tenant gate T7 (#108): `api` and `worker` as separate containers of the same image, STORAGE=s3 against
  # MinIO and no shared files volume (docker-compose.split.yml). tools/e2e/split-stack.mjs drives the real HTTP API:
  # an uploaded e-invoice and an inbound email are both read by the worker into proposals, and every blob is in the
  # bucket, none on a local path.
  split-stack:
    name: Split api and worker on S3 (end to end)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      COMPOSE: docker compose -p ludy-split -f docker-compose.yml -f docker-compose.split.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Build the images
        run: $COMPOSE build

      # The one-shot migrate and auth-grants services must exit 0 before api and worker start.
      - name: Start the split stack (applies the migrations)
        run: $COMPOSE up -d

      - name: Upload and inbound email through the API, filed by the worker, blobs in MinIO
        run: node tools/e2e/split-stack.mjs

      # The pilot layout (#2133): docker-compose.yml with tools/deploy/compose.pilot.yml, laid out as on a deploy host and
      # started from the images built above (the same Dockerfiles, tagged as the base file names them). The split stack
      # goes first, so the two are never up together.
      - name: Boot the pilot layout (compose.pilot.yml), check its topology, read an upload through it
        run: |
          $COMPOSE down -v
          docker tag ludy:split ludy:local
          docker tag ludy-extract:split ludy-extract:local
          docker tag ludy-media:split ludy-media:local
          node tools/e2e/pilot-stack.mjs

      - name: Stack logs
        if: failure()
        run: $COMPOSE logs --no-color

      - name: Tear down
        if: always()
        run: $COMPOSE down -v

  # The MCP conformance check (#4592, ADR-0051 decision 7): `docker compose up` with the MCP endpoint and its authorization server on, then
  # tools/mcp-conformance/cli.mjs (what `pnpm mcp:conformance` runs) as a connector would run it. It checks the metadata documents, OAuth with PKCE
  # and the `resource` parameter, the readOnlyHint / destructiveHint of every tool, that an R2 or R3 tool answers a pending proposal and never
  # executes, and a sample wake-up receiver. No secret and no model call: the signing key and cookie keys are made here, live for this job only and
  # are masked in the log; the account and org it signs up are in this job's throwaway database.
  mcp-conformance:
    name: MCP conformance against the compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      COMPOSE: docker compose -p ludy-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Make the throwaway OAuth keys for this job
        run: |
          JWKS=$(node -e "const {generateKeyPairSync,randomBytes}=require('node:crypto');const k=generateKeyPairSync('ec',{namedCurve:'P-256'}).privateKey.export({format:'jwk'});console.log(JSON.stringify({keys:[{...k,alg:'ES256',use:'sig',kid:'k-'+randomBytes(4).toString('hex')}]}))")
          COOKIES=$(node -e "console.log(require('node:crypto').randomBytes(32).toString('hex'))")
          echo "::add-mask::$JWKS"
          echo "::add-mask::$COOKIES"
          {
            echo "OAUTH_SERVER=on"
            echo "OAUTH_JWKS=$JWKS"
            echo "OAUTH_COOKIE_KEYS=$COOKIES"
          } >> "$GITHUB_ENV"

      - name: Build and start the compose stack
        run: $COMPOSE up -d --build

      - name: Wait until the API is ready
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8080/readyz | grep -q '"ready":true' && curl -fsS http://localhost:8080/auth/v1/health > /dev/null; then
              echo "ready after $((i * 3)) s"
              exit 0
            fi
            sleep 3
          done
          echo "the API was not ready in 6 minutes"
          exit 1

      - name: Run the conformance check (the same command a connector vendor runs)
        run: node tools/mcp-conformance/cli.mjs --url http://localhost:8080 --sign-up --strict

      - name: Stack logs
        if: failure()
        run: $COMPOSE logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: $COMPOSE down -v

  # Backups (issues #307, #351): tools/backup/drill.mjs seeds a split stack (files in MinIO), backs it up twice into
  # a throwaway MinIO (sealed with a throwaway key; the second run uploads only new blobs and prunes a stray one),
  # checks the failure alerts, wipes the stack, restores the newest run onto a scratch stack with empty volumes and an
  # empty bucket, and checks the data through the API. It removes everything it made, even on failure.
  backup-drill:
    name: Backup and restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Back up, wipe, restore and verify (s3 to s3, sealed)
        run: node tools/backup/drill.mjs
