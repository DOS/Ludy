name: gitleaks

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Build scan config (G1 blocklist)
        env:
          G1_BLOCKLIST: ${{ secrets.G1_BLOCKLIST }}
          # Fork and Dependabot PRs get no secrets; every other run must have the blocklist.
          G1_REQUIRE: ${{ github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]' }}
        run: python3 .github/scripts/g1_config.py "$RUNNER_TEMP/gitleaks.toml"

      # The full history of the commit under test only (HEAD: the PR's merge commit, or the pushed branch), not every
      # branch the checkout fetched: a leak on an unrelated branch must fail that branch's PR, not every PR in the repo.
      - name: Scan full git history of the commit under test
        run: gitleaks git . --log-opts="HEAD" --config "$RUNNER_TEMP/gitleaks.toml" --redact --verbose --no-color --exit-code 1
