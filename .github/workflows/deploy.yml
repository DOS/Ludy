name: deploy

# Deploys a release to a single docker compose host over SSH (issue #56; docs/runbooks/deploy.md):
#   - a tag v* on main deploys to the `pilot` environment;
#   - a push to `dev` deploys to `beta` (no `dev` branch exists yet; it starts with the beta instance, plan §3.5);
#   - a manual run deploys the selected tag (pilot) or `dev`/a tag (beta), or rolls the environment back.
# The commit's CI must be green first. Both images are built from that commit, pushed to GHCR and deployed by
# digest; tools/deploy/deploy.sh on the host migrates, rolls the worker before the API, waits for /readyz, runs the
# smoke test and rolls back on failure. Until the environment has its secrets, the deploy job only says so and
# passes. After a successful `pilot` tag deploy, the `release-branch` job dispatches `.github/workflows/release-branch.yml`
# on `main`, confirms `release` moved to the deployed commit, and (when `DEPLOY_APP_URL` is set) verifies the served
# static bundle's `VITE_BUILD` matches `/version` (#3580).
#
# Opt-in (#2704): when the variable DEPLOY_IDP_ENVIRONMENT names the environment being deployed, the deploy writes the identity
# provider settings (variables DEPLOY_IDP_AUTH_ISSUER, DEPLOY_IDP_AUTH_JWKS_URL, DEPLOY_IDP_PUBLIC_AUTH_URL,
# DEPLOY_IDP_PUBLIC_AUTH_ANON_KEY, DEPLOY_IDP_AUTH_OAUTH_PROVIDERS, DEPLOY_IDP_AUTH_HOSTED_LOGIN_URL,
# DEPLOY_IDP_AUTH_HOSTED_LOGIN_TOKEN_URL, DEPLOY_IDP_AUTH_HOSTED_LOGIN_NAME and the secret DEPLOY_IDP_AUTH_ALLOWED_EMAILS)
# into the host's env file (docs/runbooks/pilot-sign-in-remote-idp.md, step 5). Define them in the environment only, never at
# repository or organization level: those fall back into every environment. Without the opt-in the env file is never edited.
#
# Opt-in (#3531): when DEPLOY_MODULES_ENVIRONMENT names the environment being deployed, the deploy writes
# LUDY_MODULES=<DEPLOY_LUDY_MODULES> into the host's env file and verifies /api/config reports those modules (plus kernel).
# Define DEPLOY_MODULES_ENVIRONMENT and DEPLOY_LUDY_MODULES in the environment only.

on:
  push:
    tags: ['v*']
    branches: [dev]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [pilot, beta]
        default: pilot
      action:
        description: deploy the selected ref, or roll back to the release before the current one
        type: choice
        options: [deploy, rollback]
        default: deploy

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || (github.ref_type == 'tag' && 'pilot') || 'beta' }}
  cancel-in-progress: false

jobs:
  target:
    name: Release and target
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      checks: read
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      action: ${{ steps.target.outputs.action }}
      release: ${{ steps.target.outputs.release }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide the environment and the release
        id: target
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          environment='' action=deploy release=''
          if [ "$EVENT" = workflow_dispatch ]; then
            environment="$INPUT_ENVIRONMENT" action="$INPUT_ACTION"
          elif [ "$REF_TYPE" = tag ]; then
            environment=pilot
          elif [ "$REF" = refs/heads/dev ]; then
            environment=beta
          fi
          case "$environment" in pilot | beta) ;; *) echo "::error::no environment for $EVENT on $REF"; exit 1 ;; esac
          # Whatever the action, the pilot runs only code from main: the deploy script of the run's commit executes on
          # the host. (The environment's branch and tag rules are the boundary that holds against an edited workflow.)
          if [ "$environment" = pilot ]; then
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$SHA" origin/main; then
              echo "::error::the pilot runs only commits of main; $REF ($SHA) is not one"
              exit 1
            fi
          fi
          if [ "$action" = deploy ]; then
            if [ "$REF_TYPE" = tag ]; then
              release="$REF_NAME"
            elif [ "$environment" = beta ] && [ "$REF" = refs/heads/dev ]; then
              release="dev-${SHA:0:12}"
            else
              echo "::error::$environment deploys a tag$([ "$environment" = beta ] && echo ' or dev'); run the workflow from one (got $REF)"
              exit 1
            fi
            if ! [[ "$release" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]; then
              echo "::error::release name '$release' must match [A-Za-z0-9][A-Za-z0-9._-]{0,63}"
              exit 1
            fi
            if [ "$environment" = pilot ] && { [ "$REF_TYPE" != tag ] || [[ "$REF_NAME" != v* ]]; }; then
              echo "::error::pilot deploys only v* tags (on commits of main); got $REF"
              exit 1
            fi
          fi
          {
            echo "environment=$environment"
            echo "action=$action"
            echo "release=$release"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"
          echo "### $action to $environment${release:+: $release ($SHA)}" >> "$GITHUB_STEP_SUMMARY"

      # A release must have passed CI: the required check runs on its commit (DEPLOY_REQUIRED_CHECKS, one name per
      # line) all succeeded. Waits up to 30 minutes for runs that are still going, as after a tag right after a merge.
      - name: CI is green on the release commit
        if: steps.target.outputs.action == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REQUIRED: ${{ vars.DEPLOY_REQUIRED_CHECKS }}
        run: |
          set -euo pipefail
          if [ -z "$REQUIRED" ]; then REQUIRED=$'Lint, typecheck, test\nPlaywright on docker compose'; fi
          deadline=$((SECONDS + 1800))
          while :; do
            runs="$(gh api "repos/$REPO/commits/$SHA/check-runs?filter=latest&per_page=100" --paginate \
              --jq '.check_runs[] | [.name, .status, (.conclusion // "")] | @tsv')"
            pending=() failed=()
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              row="$(awk -F'\t' -v n="$name" '$1 == n { print; exit }' <<<"$runs")"
              status="$(cut -f2 <<<"$row")" conclusion="$(cut -f3 <<<"$row")"
              if [ "$status" != completed ]; then pending+=("$name"); elif [ "$conclusion" != success ]; then failed+=("$name: $conclusion"); fi
            done <<<"$REQUIRED"
            if ((${#failed[@]} > 0)); then printf '::error::required check not green: %s\n' "${failed[@]}"; exit 1; fi
            if ((${#pending[@]} == 0)); then echo 'every required check passed'; break; fi
            if ((SECONDS > deadline)); then printf '::error::required check missing or still running: %s\n' "${pending[@]}"; exit 1; fi
            echo "waiting for: ${pending[*]}"
            sleep 30
          done

  build:
    name: Build and push the images
    needs: target
    if: needs.target.outputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
      extract: ${{ steps.push.outputs.extract }}
      media: ${{ steps.push.outputs.media }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.target.outputs.sha }}

      - name: Build, push and read the digests
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          RELEASE: ${{ needs.target.outputs.release }}
          SHA: ${{ needs.target.outputs.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          labels=(--label "org.opencontainers.image.source=$SOURCE" --label "org.opencontainers.image.revision=$SHA" --label "org.opencontainers.image.version=$RELEASE")
          # The commit's date orders builds for the API's /readyz (worker build >= API build, #1952).
          built_at="$(git show -s --format=%cI "$SHA")"
          test -n "$built_at"
          docker build "${labels[@]}" --build-arg "LUDY_BUILD=$SHA" --build-arg "LUDY_BUILD_TIME=$built_at" -t "$repo:$RELEASE" .
          docker build "${labels[@]}" -f apps/extract/Dockerfile -t "$repo-extract:$RELEASE" .
          docker build "${labels[@]}" -f apps/media/Dockerfile -t "$repo-media:$RELEASE" .
          docker push --quiet "$repo:$RELEASE"
          docker push --quiet "$repo-extract:$RELEASE"
          docker push --quiet "$repo-media:$RELEASE"
          image="$(docker image inspect --format '{{index .RepoDigests 0}}' "$repo:$RELEASE")"
          extract="$(docker image inspect --format '{{index .RepoDigests 0}}' "$repo-extract:$RELEASE")"
          media="$(docker image inspect --format '{{index .RepoDigests 0}}' "$repo-media:$RELEASE")"
          docker logout ghcr.io
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "extract=$extract" >> "$GITHUB_OUTPUT"
          echo "media=$media" >> "$GITHUB_OUTPUT"
          printf -- '- image: `%s`\n- extract: `%s`\n- media: `%s`\n' "$image" "$extract" "$media" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to ${{ needs.target.outputs.environment }}
    needs: [target, build]
    if: ${{ !cancelled() && needs.target.result == 'success' && (needs.target.outputs.action == 'rollback' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ needs.target.outputs.environment }}
    # Read only: the token reaches the host for the image pull, so it must not be able to push an image.
    permissions:
      contents: read
      packages: read
    outputs:
      deployed: ${{ steps.host.outcome == 'success' && steps.public-smoke.outcome != 'failure' }}
      public_url: ${{ steps.config.outputs.public_url }}
      app_url: ${{ steps.config.outputs.app_url }}
    env:
      ACTION: ${{ needs.target.outputs.action }}
      RELEASE: ${{ needs.target.outputs.release }}
      IMAGE: ${{ needs.build.outputs.image }}
      EXTRACT: ${{ needs.build.outputs.extract }}
      MEDIA: ${{ needs.build.outputs.media }}
      # The commit the image was built from; GET /version reports it (#892).
      BUILD: ${{ needs.target.outputs.sha }}
      PUBLIC_URL: ${{ vars.DEPLOY_PUBLIC_URL }}
    steps:
      - name: Check the environment's settings
        id: config
        env:
          ENVIRONMENT: ${{ needs.target.outputs.environment }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          DEPLOY_ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}
          APP_URL: ${{ vars.DEPLOY_APP_URL }}
        run: |
          set -euo pipefail
          missing=()
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if ((${#missing[@]} > 0)); then
            msg="Deploy skipped: the $ENVIRONMENT environment has no ${missing[*]} secret(s) yet. See docs/runbooks/deploy.md."
            echo "::notice title=Deploy not configured::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          port="${DEPLOY_PORT:-22}" dir="${DEPLOY_DIR:-/opt/ludy}"
          env_file="${DEPLOY_ENV_FILE:-$dir/.env}"
          # Checked here because they become part of the SSH configuration and the remote command line.
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.:-]+$ ]] || { echo '::error::DEPLOY_HOST must be a host name or an IP address'; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo '::error::DEPLOY_USER must be a plain user name'; exit 1; }
          [[ "$port" =~ ^[0-9]{1,5}$ ]] && ((port >= 1 && port <= 65535)) || { echo '::error::DEPLOY_PORT must be a port number'; exit 1; }
          [[ "$dir" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo '::error::DEPLOY_DIR must be an absolute path of letters, digits, ., _, - and /'; exit 1; }
          [[ "$env_file" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo '::error::DEPLOY_ENV_FILE must be an absolute path of letters, digits, ., _, - and /'; exit 1; }
          if [ -n "$PUBLIC_URL" ] && ! [[ "$PUBLIC_URL" =~ ^https?://[A-Za-z0-9.:-]+/?$ ]]; then
            echo '::error::DEPLOY_PUBLIC_URL must be an origin such as https://ludy.example.com'
            exit 1
          fi
          if [ -n "$APP_URL" ] && ! [[ "$APP_URL" =~ ^https?://[A-Za-z0-9.:-]+/?$ ]]; then
            echo '::error::DEPLOY_APP_URL must be an origin such as https://app.example.com'
            exit 1
          fi

          ssh_dir="$RUNNER_TEMP/deploy-ssh"
          install -m 700 -d "$ssh_dir"
          (umask 077; printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"; printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts")
          # The host key must be listed in DEPLOY_KNOWN_HOSTS: no trust on first use.
          cat > "$ssh_dir/config" <<EOF
          Host ludy-target
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $port
            IdentityFile $ssh_dir/key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $ssh_dir/known_hosts
            GlobalKnownHostsFile /dev/null
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 10
          EOF
          {
            echo 'ready=true'
            echo "ssh_config=$ssh_dir/config"
            echo "dir=$dir"
            echo "env_file=$env_file"
            echo "remote=$dir/.deploy/incoming/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "public_url=${PUBLIC_URL%/}"
            echo "app_url=${APP_URL%/}"
          } >> "$GITHUB_OUTPUT"

      # The release's compose file and deploy script; a rollback uses the script of the ref this run started from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.ready == 'true'
        with:
          persist-credentials: false
          ref: ${{ needs.target.outputs.action == 'deploy' && needs.target.outputs.sha || github.sha }}

      # The identity provider settings (#2704), when the variable DEPLOY_IDP_ENVIRONMENT names this environment: written to a private
      # file from the DEPLOY_IDP_* variables and secret (as environment variables, never interpolated into the script), checked by the
      # release's own deploy.sh, and sent with the release. It prints the names it set, never a value. deploy.sh on the host checks the
      # file again and edits the env file; the file goes with the rest of the incoming directory when the run ends. A rollback sends
      # nothing. The deploy-specific names and the opt-in keep a variable of the same name at repository or organization level (the
      # kernel's own setting names, which another project may use) from reaching an environment that did not ask for it.
      - name: Prepare the identity provider settings
        id: idp
        if: steps.config.outputs.ready == 'true' && needs.target.outputs.action == 'deploy'
        env:
          ENVIRONMENT: ${{ needs.target.outputs.environment }}
          OPT_IN: ${{ vars.DEPLOY_IDP_ENVIRONMENT }}
          DEPLOY_IDP_AUTH_ISSUER: ${{ vars.DEPLOY_IDP_AUTH_ISSUER }}
          DEPLOY_IDP_AUTH_JWKS_URL: ${{ vars.DEPLOY_IDP_AUTH_JWKS_URL }}
          DEPLOY_IDP_PUBLIC_AUTH_URL: ${{ vars.DEPLOY_IDP_PUBLIC_AUTH_URL }}
          DEPLOY_IDP_PUBLIC_AUTH_ANON_KEY: ${{ vars.DEPLOY_IDP_PUBLIC_AUTH_ANON_KEY }}
          DEPLOY_IDP_AUTH_OAUTH_PROVIDERS: ${{ vars.DEPLOY_IDP_AUTH_OAUTH_PROVIDERS }}
          DEPLOY_IDP_AUTH_HOSTED_LOGIN_URL: ${{ vars.DEPLOY_IDP_AUTH_HOSTED_LOGIN_URL }}
          DEPLOY_IDP_AUTH_HOSTED_LOGIN_TOKEN_URL: ${{ vars.DEPLOY_IDP_AUTH_HOSTED_LOGIN_TOKEN_URL }}
          DEPLOY_IDP_AUTH_HOSTED_LOGIN_NAME: ${{ vars.DEPLOY_IDP_AUTH_HOSTED_LOGIN_NAME }}
          DEPLOY_IDP_AUTH_ALLOWED_EMAILS: ${{ secrets.DEPLOY_IDP_AUTH_ALLOWED_EMAILS }}
        run: |
          set -euo pipefail
          # The settings carry the kernel's own names (the lines of the env file) behind the DEPLOY_IDP_ prefix.
          names=(AUTH_ISSUER AUTH_JWKS_URL PUBLIC_AUTH_URL PUBLIC_AUTH_ANON_KEY AUTH_ALLOWED_EMAILS AUTH_OAUTH_PROVIDERS AUTH_HOSTED_LOGIN_URL AUTH_HOSTED_LOGIN_TOKEN_URL AUTH_HOSTED_LOGIN_NAME)
          given=()
          for name in "${names[@]}"; do
            src="DEPLOY_IDP_$name"
            if [ -n "${!src}" ]; then given+=("$name"); fi
          done
          if [ "$OPT_IN" != "$ENVIRONMENT" ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            if ((${#given[@]} > 0)); then
              echo "::notice title=Identity provider settings ignored::DEPLOY_IDP_* settings are defined but DEPLOY_IDP_ENVIRONMENT is not '$ENVIRONMENT': the host env file is left alone. Define them in the environment only."
            else
              echo 'No identity provider settings opted in for this environment: the host env file is left alone.'
            fi
            exit 0
          fi
          if ((${#given[@]} == 0)); then
            echo "::error::DEPLOY_IDP_ENVIRONMENT is '$ENVIRONMENT' but no DEPLOY_IDP_* setting is defined"
            exit 1
          fi
          dir="$RUNNER_TEMP/idp"
          install -m 700 -d "$dir"
          (
            umask 077
            : > "$dir/auth-settings.env"
            for name in "${given[@]}"; do
              src="DEPLOY_IDP_$name"
              value="${!src}"
              case "$value" in
                *$'\n'* | *$'\r'*) echo "::error::$src must be one line"; exit 1 ;;
              esac
              printf '%s=%s\n' "$name" "$value" >> "$dir/auth-settings.env"
            done
          )
          # Names only: a failed check names the setting, not its value.
          bash tools/deploy/deploy.sh check-auth-settings "$dir/auth-settings.env"
          echo "Settings given: ${given[*]}" >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'enabled=true'
            echo "file=$dir/auth-settings.env"
            # The Auth URL (public) the public smoke test must find in /api/config.
            echo "auth_url=$DEPLOY_IDP_PUBLIC_AUTH_URL"
          } >> "$GITHUB_OUTPUT"

      # Opt-in (#3531): when DEPLOY_MODULES_ENVIRONMENT names this environment, validate DEPLOY_LUDY_MODULES and pass it via
      # --modules to deploy.sh, plus SMOKE_EXPECT_MODULES to the public smoke check. Define both in the environment only.
      - name: Prepare the module settings
        id: modules
        if: steps.config.outputs.ready == 'true' && needs.target.outputs.action == 'deploy'
        env:
          ENVIRONMENT: ${{ needs.target.outputs.environment }}
          OPT_IN: ${{ vars.DEPLOY_MODULES_ENVIRONMENT }}
          MODULES: ${{ vars.DEPLOY_LUDY_MODULES }}
        run: |
          set -euo pipefail
          if [ "$OPT_IN" != "$ENVIRONMENT" ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            if [ -n "$MODULES" ]; then
              echo "::notice title=Module settings ignored::DEPLOY_LUDY_MODULES is defined but DEPLOY_MODULES_ENVIRONMENT is not '$ENVIRONMENT': the host env file is left alone. Define them in the environment only."
            else
              echo 'No module settings opted in for this environment: the host env file is left alone.'
            fi
            exit 0
          fi
          if [ -z "$MODULES" ]; then
            echo "::error::DEPLOY_MODULES_ENVIRONMENT is '$ENVIRONMENT' but DEPLOY_LUDY_MODULES is empty"
            exit 1
          fi
          case "$MODULES" in
            *$'\n'* | *$'\r'*) echo '::error::DEPLOY_LUDY_MODULES must be one line'; exit 1 ;;
          esac
          bash tools/deploy/deploy.sh check-modules "$MODULES"
          echo "Modules given: $MODULES" >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'enabled=true'
            echo "modules=$MODULES"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the deploy script and the compose file
        if: steps.config.outputs.ready == 'true'
        env:
          SSH_CONFIG: ${{ steps.config.outputs.ssh_config }}
          REMOTE: ${{ steps.config.outputs.remote }}
          IDP_FILE: ${{ steps.idp.outputs.file }}
        run: |
          set -euo pipefail
          # compose.pilot.yml travels with the release (#2133): deploy.sh stages it from the directory of the compose file.
          # A release from before the file existed has none to send.
          files=(deploy.sh)
          if [ -f tools/deploy/compose.pilot.yml ]; then files+=(compose.pilot.yml); fi
          # The identity provider settings (private, #2704) travel in the same private directory.
          extra=()
          if [ -n "$IDP_FILE" ]; then extra=(-C "$(dirname "$IDP_FILE")" auth-settings.env); fi
          tar -cf - -C tools/deploy "${files[@]}" -C "$GITHUB_WORKSPACE" docker-compose.yml "${extra[@]}" \
            | ssh -F "$SSH_CONFIG" ludy-target "umask 077 && mkdir -p '$REMOTE' && tar -xf - -C '$REMOTE'"

      - name: Deploy, or roll back, on the host
        id: host
        if: steps.config.outputs.ready == 'true'
        env:
          SSH_CONFIG: ${{ steps.config.outputs.ssh_config }}
          REMOTE: ${{ steps.config.outputs.remote }}
          DIR: ${{ steps.config.outputs.dir }}
          ENV_FILE: ${{ steps.config.outputs.env_file }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          IDP_ENABLED: ${{ steps.idp.outputs.enabled }}
          MODULES_ENABLED: ${{ steps.modules.outputs.enabled }}
          MODULES: ${{ steps.modules.outputs.modules }}
        run: |
          set -euo pipefail
          [[ "$ACTOR" =~ ^[A-Za-z0-9._-]+(\[bot\])?$ ]] || { echo '::error::unexpected actor name'; exit 1; }
          # The read-only token goes over stdin: never on a command line, and the host keeps it only for the pull.
          registry="--dir '$DIR' --env-file '$ENV_FILE' --registry ghcr.io --registry-user '$ACTOR' --registry-password-stdin"
          if [ "$ACTION" = rollback ]; then
            printf '%s\n' "$GH_TOKEN" | ssh -F "$SSH_CONFIG" ludy-target "bash '$REMOTE/deploy.sh' rollback $registry"
          else
            [[ "$IMAGE" =~ ^[a-z0-9./_:-]+@sha256:[0-9a-f]{64}$ && "$EXTRACT" =~ ^[a-z0-9./_:-]+@sha256:[0-9a-f]{64}$ && "$MEDIA" =~ ^[a-z0-9./_:-]+@sha256:[0-9a-f]{64}$ ]] || { echo '::error::image digests missing'; exit 1; }
            [[ "$BUILD" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::the release commit is missing'; exit 1; }
            # The settings file is on the host (sent above); deploy.sh edits the env file only when it is given.
            settings=''
            if [ "$IDP_ENABLED" = true ]; then settings+=" --auth-settings '$REMOTE/auth-settings.env'"; fi
            if [ "$MODULES_ENABLED" = true ]; then
              [[ "$MODULES" =~ ^[a-z][a-z0-9_]{0,31}(,[a-z][a-z0-9_]{0,31}){0,9}$ ]] || { echo '::error::unexpected module list'; exit 1; }
              settings+=" --modules '$MODULES'"
            fi
            printf '%s\n' "$GH_TOKEN" | ssh -F "$SSH_CONFIG" ludy-target \
              "bash '$REMOTE/deploy.sh' deploy $registry --release '$RELEASE' --image '$IMAGE' --extract-image '$EXTRACT' --media-image '$MEDIA' --build '$BUILD' --compose '$REMOTE/docker-compose.yml'$settings"
          fi

      # The same checks through the public URL: DNS, TLS and the reverse proxy. Optional (DEPLOY_PUBLIC_URL). With the
      # smoke account's secrets (#690, docs/runbooks/deploy.md "Smoke account") it also signs in and uploads one
      # synthetic e-invoice into the smoke org; without them that step is skipped with a notice. A deploy also checks
      # that /version reports the release commit (#892): the public URL reaches the new image, not an old one.
      - name: Smoke test through the public URL
        id: public-smoke
        if: steps.config.outputs.ready == 'true' && env.PUBLIC_URL != ''
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_ORG: ${{ vars.SMOKE_ORG }}
          # A remote identity provider has no /auth/v1 proxy on this host (#2704): the smoke test reads that from the deployed
          # /api/config, not from these settings. When this run wrote the settings it also demands the Auth URL it was given.
          SMOKE_EXPECT_AUTH_URL: ${{ steps.idp.outputs.auth_url }}
          SMOKE_EXPECT_MODULES: ${{ steps.modules.outputs.modules }}
        run: |
          if [ "$ACTION" = deploy ]; then bash tools/deploy/deploy.sh smoke "$PUBLIC_URL" "$BUILD"; else bash tools/deploy/deploy.sh smoke "$PUBLIC_URL"; fi

      - name: Roll back after a failed public smoke test
        if: failure() && steps.public-smoke.outcome == 'failure' && env.ACTION == 'deploy'
        env:
          SSH_CONFIG: ${{ steps.config.outputs.ssh_config }}
          REMOTE: ${{ steps.config.outputs.remote }}
          DIR: ${{ steps.config.outputs.dir }}
          ENV_FILE: ${{ steps.config.outputs.env_file }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo '::error::the public smoke test failed; rolling back'
          [[ "$ACTOR" =~ ^[A-Za-z0-9._-]+(\[bot\])?$ ]] || { echo '::error::unexpected actor name'; exit 1; }
          printf '%s\n' "$GH_TOKEN" | ssh -F "$SSH_CONFIG" ludy-target \
            "bash '$REMOTE/deploy.sh' rollback --dir '$DIR' --env-file '$ENV_FILE' --registry ghcr.io --registry-user '$ACTOR' --registry-password-stdin"

      - name: Summary
        if: always() && steps.config.outputs.ready == 'true'
        env:
          HOST_OUTCOME: ${{ steps.host.outcome }}
          SMOKE_OUTCOME: ${{ steps.public-smoke.outcome }}
          IDP_ENABLED: ${{ steps.idp.outputs.enabled }}
          MODULES_ENABLED: ${{ steps.modules.outputs.enabled }}
          MODULES: ${{ steps.modules.outputs.modules }}
        run: |
          {
            echo "- $ACTION on the host: $HOST_OUTCOME"
            if [ "$IDP_ENABLED" = true ]; then echo '- identity provider settings: given to the deploy (the host log names what changed)'; fi
            if [ "$MODULES_ENABLED" = true ]; then echo "- module settings: updated for LUDY_MODULES=$MODULES (when changed; see host log)"; fi
            echo "- public smoke test: ${SMOKE_OUTCOME:-not run (no DEPLOY_PUBLIC_URL)}"
            if [ "$ACTION" = deploy ]; then echo "- release: $RELEASE"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up
        if: always() && steps.config.outputs.ready == 'true'
        env:
          SSH_CONFIG: ${{ steps.config.outputs.ssh_config }}
          REMOTE: ${{ steps.config.outputs.remote }}
        run: |
          ssh -F "$SSH_CONFIG" ludy-target "rm -rf '$REMOTE'" < /dev/null || true
          rm -rf "$(dirname "$SSH_CONFIG")" "$RUNNER_TEMP/idp"

  # The partner's release notes (#691; plan §7 rule 6): one line per PR, from the "Release note (vi):" line of its body
  # (tools/release-notes.mjs). Written to the summary on every v* tag; published as the tag's GitHub Release only once
  # the release actually runs on the pilot (done means deployed).
  release-notes:
    name: Release notes
    needs: [target, deploy]
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.target.outputs.action == 'deploy' && needs.target.outputs.environment == 'pilot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.target.outputs.sha }}

      - name: Collect the notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.target.outputs.release }}
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)"
          node tools/release-notes.mjs "$previous" "$TAG" > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the GitHub Release
        if: needs.deploy.outputs.deployed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.target.outputs.release }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

  # Moves the web app's `release` branch (Vercel Production, docs/runbooks/split-app-api.md) to the deployed tag after
  # the pilot API rollout succeeds (#3580), so the static host never drifts behind the API. Dispatches release-branch.yml
  # on `main` (the `release` environment allows `main` only), waits for it to finish, verifies `release` points at the
  # deployed commit, and, when DEPLOY_APP_URL is set, checks that the served bundle's VITE_BUILD matches /version.
  release-branch:
    name: Sync release branch
    needs: [target, deploy]
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.target.result == 'success' && needs.deploy.result == 'success' && needs.target.outputs.action == 'deploy' && needs.target.outputs.environment == 'pilot' && needs.deploy.outputs.deployed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.deploy.outputs.app_url != ''
        with:
          persist-credentials: false
          ref: ${{ needs.target.outputs.sha }}

      - name: Dispatch release-branch workflow and verify release ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.target.outputs.release }}
          SHA: ${{ needs.target.outputs.sha }}
        run: |
          set -euo pipefail
          before_id="$(gh api "repos/$REPO/actions/workflows/release-branch.yml/runs?event=workflow_dispatch&branch=main&per_page=1" \
            --jq '.workflow_runs[0].id // 0' 2>/dev/null || echo 0)"
          [[ "$before_id" =~ ^[0-9]+$ ]] || before_id=0
          dispatched_at="$(date -u -d '30 seconds ago' +%Y-%m-%dT%H:%M:%SZ)"
          response="$(jq -cn --arg tag "$TAG" '{ref: "main", inputs: {tag: $tag}}' \
            | gh api -X POST "repos/$REPO/actions/workflows/release-branch.yml/dispatches" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2026-03-10' \
                --input -)"
          run_id="$(jq -r '.workflow_run_id // empty' <<<"$response" 2>/dev/null || true)"
          run_url="$(jq -r '.html_url // empty' <<<"$response" 2>/dev/null || true)"
          if [ -z "$run_id" ]; then
            echo 'No workflow_run_id in dispatch response; looking up the dispatched run...'
            lookup_deadline=$((SECONDS + 120))
            while :; do
              row="$(gh api "repos/$REPO/actions/workflows/release-branch.yml/runs?event=workflow_dispatch&branch=main&created=>=$dispatched_at&per_page=10" 2>/dev/null \
                | jq -r --argjson before "$before_id" '([.workflow_runs[] | select(.id > $before)] | first) // empty | "\(.id)\t\(.html_url)"' || true)"
              if [ -n "$row" ]; then
                run_id="${row%%$'\t'*}"
                run_url="${row#*$'\t'}"
                break
              fi
              if ((SECONDS >= lookup_deadline)); then
                echo "::error::dispatched release-branch.yml for $TAG, but could not find its workflow run"
                exit 1
              fi
              sleep 5
            done
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "::error::unexpected workflow_run_id '$run_id'"; exit 1; }

          echo "Waiting for release-branch run $run_id${run_url:+ ($run_url)}"
          deadline=$((SECONDS + 2700))
          consecutive_errors=0
          while :; do
            if run_info="$(gh api "repos/$REPO/actions/runs/$run_id" --jq '.status, (.conclusion // ""), (.html_url // "")' 2>/dev/null)"; then
              consecutive_errors=0
              {
                IFS= read -r status
                IFS= read -r conclusion
                IFS= read -r html_url
              } <<<"$run_info" || true
              if [ -n "$html_url" ]; then run_url="$html_url"; fi
              if [ "$status" = completed ]; then
                if [ "$conclusion" != success ]; then
                  echo "::error::release-branch run $run_id (${run_url:-unknown}) ended with conclusion '${conclusion:-unknown}'"
                  exit 1
                fi
                echo "release-branch run $run_id succeeded (${run_url:-unknown})"
                break
              fi
              echo "release-branch run $run_id status: $status"
            else
              consecutive_errors=$((consecutive_errors + 1))
              if ((consecutive_errors >= 6)); then
                echo "::error::failed to query release-branch run $run_id after $consecutive_errors consecutive attempts"
                exit 1
              fi
              echo "Transient error querying release-branch run $run_id; retrying..."
            fi
            if ((SECONDS >= deadline)); then
              echo "::error::timed out waiting for release-branch run $run_id (${run_url:-unknown}) to complete"
              exit 1
            fi
            sleep 10
          done

          release_sha="$(gh api "repos/$REPO/git/ref/heads/release" \
            --jq 'if type == "array" then (.[] | select(.ref == "refs/heads/release") | .object.sha) else select(.ref == "refs/heads/release") | .object.sha end')"
          if [ "$release_sha" != "$SHA" ]; then
            echo "::error::release branch points to ${release_sha:-none}, expected $SHA ($TAG)"
            exit 1
          fi
          echo "Verified: refs/heads/release points to $release_sha ($TAG)"
          echo "- release branch: \`$release_sha\` ($TAG)${run_url:+ ([run]($run_url))}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify web app bundle matches /version
        if: needs.deploy.outputs.app_url != ''
        env:
          APP_URL: ${{ needs.deploy.outputs.app_url }}
          PUBLIC_URL: ${{ needs.deploy.outputs.public_url }}
          SHA: ${{ needs.target.outputs.sha }}
        run: |
          set -euo pipefail
          bash tools/deploy/deploy.sh check-app-build "$APP_URL" "$SHA" "$PUBLIC_URL"

      - name: Note web bundle check skipped
        if: needs.deploy.outputs.app_url == ''
        env:
          SHA: ${{ needs.target.outputs.sha }}
        run: |
          echo "::notice title=Web bundle check skipped::DEPLOY_APP_URL is not set; release branch points to $SHA without verifying the live static bundle against /version."
