# SPDX-License-Identifier: AGPL-3.0-only
# TEMPORARY diagnostics for #4023 (deleted before merge): memory during `pnpm -r typecheck` at several concurrencies.
name: typecheck-diag
on:
  pull_request:
    paths: ['.github/workflows/typecheck-diag.yml']
permissions:
  contents: read
jobs:
  diag:
    name: diag ${{ matrix.v.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        v:
          - { name: seq-a, cmd: 'pnpm -r --workspace-concurrency=1 typecheck' }
          - { name: seq-b, cmd: 'pnpm -r --workspace-concurrency=1 typecheck' }
          - { name: seq-c, cmd: 'pnpm -r --workspace-concurrency=1 typecheck' }
          - { name: kernel-default, cmd: 'pnpm --filter @crove/kernel-server typecheck' }
          - { name: kernel-8g, cmd: 'NODE_OPTIONS=--max-old-space-size=8192 pnpm --filter @crove/kernel-server typecheck' }
          - { name: kernel-6g, cmd: 'NODE_OPTIONS=--max-old-space-size=6144 pnpm --filter @crove/kernel-server typecheck' }
          - { name: app-default, cmd: 'pnpm --filter @crove/app typecheck' }
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: ci-postgres
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - run: npm install -g pnpm@10.34.7 --no-fund --no-audit
      - run: pnpm install --frozen-lockfile --filter "@crove/kernel-server..." --filter "@crove/app..." --filter "./modules/*" --filter "@crove/e2e" --filter "@crove/web" --filter "@crove/extension" --filter "@crove/media..." --filter "crove-monorepo"
      - name: Machine
        run: |
          nproc; free -m; cat /proc/pressure/memory 2>/dev/null || true; swapon --show || true; df -h / | tail -1
      - name: Typecheck with monitor
        run: |
          cat > /tmp/mon.sh <<'MON'
          #!/bin/bash
          peak=0
          while true; do
            used=$(awk '/MemTotal/{t=$2}/MemAvailable/{a=$2}END{print int((t-a)/1024)}' /proc/meminfo)
            procs=""
            for p in $(pgrep -f 'typescript/lib/(tsc|_tsc)|tsc.js|/tsc( |$)' 2>/dev/null); do
              rss=$(awk '/VmRSS/{print int($2/1024)}' /proc/$p/status 2>/dev/null)
              cwd=$(readlink /proc/$p/cwd 2>/dev/null | sed 's#.*/\(apps\|packages\|modules\)/#\1/#')
              [ -n "$rss" ] && [ "$rss" -gt 100 ] && procs="$procs $cwd=${rss}M"
            done
            echo "$(date +%T) used=${used}M psi=$(grep some /proc/pressure/memory 2>/dev/null | sed 's/.*avg10=\([0-9.]*\).*/\1/') tsc:$procs"
            sleep 3
          done
          MON
          chmod +x /tmp/mon.sh
          /tmp/mon.sh > /tmp/mon.log 2>&1 &
          tail -f /tmp/mon.log | sed 's/^/MON /' &
          start=$(date +%s)
          set +e
          ${{ matrix.v.cmd }}
          rc=$?
          echo "typecheck rc=$rc after $(( $(date +%s) - start ))s"
          echo "peak used: $(sed 's/.*used=\([0-9]*\)M.*/\1/' /tmp/mon.log | sort -n | tail -1)M"
          exit $rc
