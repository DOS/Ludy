name: e2e

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  # A newer push replaces a pull request's run; a push to main or dev always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The suite ran as one job: 130 tests one after another took 22 to 24 minutes against a 25-minute timeout (#2788). It runs in
  # four shards now, each its own job with its own docker compose stack (fresh volumes), balanced by measured file time
  # (tools/ci/e2e-shards.mjs, times in tools/ci/e2e-test-times.json). A spec file is never split and never skipped:
  # tools/test/e2e-shards.test.ts checks that every file is in exactly one shard. The required check "Playwright on docker
  # compose" is the gate job below, which passes only when every shard passed.
  shard:
    name: Playwright shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1', '2', '3', '4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install pnpm
        run: npm install -g pnpm@10.34.7 --no-fund --no-audit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@crove/e2e"

      - name: Install Chromium
        run: pnpm --filter @crove/e2e exec playwright install --with-deps chromium

      # Fresh volumes on every run: the runner starts empty.
      - name: Build and start the stack
        run: pnpm --filter @crove/e2e stack:up

      - name: Playwright
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          echo "E2E_SHARD_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          mapfile -t files < <(node tools/ci/e2e-shards.mjs "$SHARD" 4)
          echo "Running ${#files[@]} spec files"
          pnpm --filter @crove/e2e exec playwright test "${files[@]}"

      # Planned against actual time, so an imbalance shows in the summary before it reaches the timeout (#2788).
      - name: Duration of this shard
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          started="${E2E_SHARD_STARTED:-}"
          [ -n "$started" ] || exit 0
          elapsed=$(( $(date +%s) - started ))
          planned=$(node tools/ci/e2e-shards.mjs --plan 4 | awk -F'|' -v n="$SHARD" '$2 ~ "^ "n" of" { gsub(/ /, "", $4); print $4 "s" }')
          printf 'Playwright shard %s of 4: tests ran %dm%02ds (planned test time %s, job timeout 20m)\n' "$SHARD" $((elapsed / 60)) $((elapsed % 60)) "$planned" >> "$GITHUB_STEP_SUMMARY"

      - name: Stack logs
        if: failure()
        run: pnpm --filter @crove/e2e stack:logs

      # The trace of every failed test (trace: 'retain-on-failure'), so a flake can be read step by step (#1547). Synthetic
      # data of a throwaway stack only.
      - name: Traces of the failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: pnpm --filter @crove/e2e stack:down

  # The required check keeps its name: one job that fails unless every shard passed (a cancelled or skipped shard fails it).
  inbox:
    name: Playwright on docker compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [shard]
    if: always()
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.shard.result }}
        run: |
          echo "Playwright shards: $SHARDS"
          test "$SHARDS" = success
