# Issue #251: GitHub does not re-run pull_request checks when the base branch moves, so a PR whose new migration was
# newer than its base branch when its Docs check ran can fall behind while it waits. After every push to dev or main,
# re-run the Docs check of open PRs targeting that branch whose added migrations are no longer newer than the base; its
# Migration order step reads the live base branch and fails the required check. A re-run replays the original run's
# workflow file, so for a run from before that step existed (or when a re-run is refused) it creates a failing
# "Docs check" check run on the PR head instead. Runs trusted code from the pushed protected base branch (dev or main)
# only: PR heads are fetched as git objects and read with ls-tree/diff, never checked out or executed. See
# tools/ci/migration-recheck.mjs.
name: migration-recheck

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-recheck-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recheck:
    name: Re-check open PR migrations
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write # re-run a PR's Docs check workflow run
      checks: write # fallback: a failing "Docs check" check run on a PR head whose run cannot be re-run usefully
      pull-requests: read # list open PRs targeting the pushed branch (dev or main)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history of the pushed branch (dev or main), so every open PR head has a merge base with it.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Re-run the Docs check of PRs whose migrations fell behind
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/migration-recheck.mjs "${GITHUB_REF_NAME}" HEAD
