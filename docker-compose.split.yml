# Split roles on S3 storage (External-tenant gate T7): `api` and `worker` run as separate containers from the same
# image, with STORAGE=s3 against MinIO and no shared files volume. An override of docker-compose.yml:
#
#   docker compose -p ludy-split -f docker-compose.yml -f docker-compose.split.yml up -d --build
#   node tools/e2e/split-stack.mjs
#   docker compose -p ludy-split -f docker-compose.yml -f docker-compose.split.yml down -v
#   docker image rm ludy:split ludy-extract:split ludy-media:split
#
# The CI job `split-stack` in .github/workflows/ci.yml runs exactly this. The all-in-one `ludy` service is moved
# to the `all-in-one` profile, so it does not start. Images are tagged :split so a running default stack keeps its
# own. Every secret here is a throwaway value for local use; the API listens on 127.0.0.1:${SPLIT_PORT:-18080}.
# The project name below keeps it apart from the default `ludy` stack (and its database) even without `-p`.
name: ludy-split

x-ludy-env: &ludy-env
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-only-jwt-secret-change-me-0123456789}
  AUTH_ISSUER: ludy-auth
  AUTH_AUTOCONFIRM: 'true'
  AUTH_SESSION_CHECK: db
  AUTH_STEP_UP: 'off'
  AUTH_UPSTREAM_URL: http://auth:9999
  DATABASE_URL: postgres://ludy_app:${LUDY_APP_DB_PASSWORD:-local-app-password}@db:5432/postgres
  LUDY_CONTEXT_TOKEN_KEY: ${LUDY_CONTEXT_TOKEN_KEY:-}
  # JSON logs and the pool sizes (#2175), as in docker-compose.yml.
  LOG_FORMAT: ${LOG_FORMAT:-text}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  WORKER_DATABASE_POOL_MAX: ${WORKER_DATABASE_POOL_MAX:-10}
  PUBLIC_URL: http://localhost:${SPLIT_PORT:-18080}
  INBOUND_DOMAIN: inbound.ludy.test
  INBOUND_SECRET: split-stack-inbound-secret-0123456789abcdef
  STORAGE: s3
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: ludy-files
  S3_ACCESS_KEY_ID: ludy-split
  S3_SECRET_ACCESS_KEY: ludy-split-minio-secret
  S3_FORCE_PATH_STYLE: 'true'
  # The bucket is versioned (minio-init), as evidence buckets must be (ADR-0013). MinIO's port is not published, so
  # browsers could not reach presigned URLs: transfers stream through the kernel, downloads pinned to the version.
  S3_VERSIONING: required
  S3_PRESIGNED_URLS: 'false'

services:
  migrate:
    image: ludy:split

  # Same URLs and sign-up settings as the API below, whatever a local .env says.
  auth:
    environment:
      API_EXTERNAL_URL: http://localhost:${SPLIT_PORT:-18080}/auth/v1
      GOTRUE_JWT_ISSUER: ludy-auth
      GOTRUE_SITE_URL: http://localhost:${SPLIT_PORT:-18080}
      GOTRUE_URI_ALLOW_LIST: http://localhost:${SPLIT_PORT:-18080}/**
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'

  auth-grants:
    image: ludy:split

  ludy:
    image: ludy:split
    profiles: ['all-in-one']

  ludy-extract:
    image: ludy-extract:split

  ludy-media:
    image: ludy-media:split

  # Same image and digest as the MinIO in the CI `check` job. Not on the `extract` network: the sandbox has no route
  # to the blobs. No port is published; tools/e2e/split-stack.mjs lists the bucket with `mc` inside the container.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ludy-split
      MINIO_ROOT_PASSWORD: ludy-split-minio-secret
      # For `docker compose exec minio mc ...`.
      MC_HOST_local: http://ludy-split:ludy-split-minio-secret@127.0.0.1:9000
    healthcheck:
      test: ['CMD', 'curl', '--silent', '--fail', 'http://127.0.0.1:9000/minio/health/live']
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    entrypoint: ['sh', '-c']
    # ludy-archive: the WORM fact stream (#891) needs a bucket created with Object Lock (which also turns versioning on).
    # ludy-split-prober (#2094): the prober's own user, which can only list that bucket and read its verify/ and chain/
    # objects, as docs/runbooks/worm-archive.md advises for a deployment. Attaching a policy twice fails, so it is detached
    # first (which fails the first time, hence the `|| true`): a second run of this container, with volumes kept across two
    # `up`s, then works too.
    command:
      - |
        set -e
        mc mb --ignore-existing local/ludy-files
        mc version enable local/ludy-files
        mc mb --ignore-existing --with-lock local/ludy-archive
        cat > /tmp/archive-reader.json <<'POLICY'
        {"Version": "2012-10-17", "Statement": [
          {"Effect": "Allow", "Action": ["s3:ListBucket", "s3:ListBucketVersions"], "Resource": ["arn:aws:s3:::ludy-archive"]},
          {"Effect": "Allow", "Action": ["s3:GetObject"], "Resource": ["arn:aws:s3:::ludy-archive/verify/*", "arn:aws:s3:::ludy-archive/chain/*"]}
        ]}
        POLICY
        mc admin policy create local archive-reader /tmp/archive-reader.json
        mc admin user add local ludy-split-prober ludy-split-prober-secret
        mc admin policy detach local archive-reader --user ludy-split-prober || true
        mc admin policy attach local archive-reader --user ludy-split-prober
    environment:
      MC_HOST_local: http://ludy-split:ludy-split-minio-secret@minio:9000
    depends_on:
      minio:
        condition: service_healthy

  # HTTP API and web UI only. It stores uploads and inbound mail in the bucket and never calls ludy-extract, so it
  # is not on the `extract` network.
  api:
    build: .
    image: ludy:split
    command: ['api']
    restart: unless-stopped
    environment:
      <<: *ludy-env
    ports:
      - '127.0.0.1:${SPLIT_PORT:-18080}:8080'
    networks:
      default:
        aliases:
          - ludy
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth:
        condition: service_started
      auth-grants:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  # Outbox relay and jobs: reads the blobs the API stored, has ludy-extract parse them and files the results.
  worker:
    build: .
    image: ludy:split
    command: ['worker']
    restart: unless-stopped
    # The image's healthcheck probes the API port, which the worker does not open.
    healthcheck:
      disable: true
    environment:
      <<: *ludy-env
      WORKER_DATABASE_URL: postgres://ludy_worker:${LUDY_WORKER_DB_PASSWORD:-local-worker-password}@db:5432/postgres
      EXTRACT_URL: http://ludy-extract:8090
      # The sandbox's slots (docker-compose.yml gives the same value to ludy-extract), which the worker never exceeds.
      EXTRACT_CONCURRENCY: ${EXTRACT_CONCURRENCY:-4}
      # The WORM fact stream (#891) in the Object Lock bucket, with the shortest lag so the run sees a batch.
      ARCHIVE_STORE: s3
      ARCHIVE_S3_BUCKET: ludy-archive
      ARCHIVE_LAG_SECONDS: '60'
    networks:
      - default
      - extract
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth-grants:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      ludy-extract:
        condition: service_healthy

  # The prober (profile `prober`) asks Supabase Auth through the API's /auth/v1 proxy: `ludy` does not run here (#1994).
  prober:
    # The image built for this stack, like api and worker, so the probe the end-to-end script runs is of this checkout's code
    # (the base file names ludy:local, which an earlier run may have left behind).
    image: ludy:split
    # Its bucket and its MinIO user (#2094) exist once minio-init is done, so the first probe finds them.
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      PROBER_AUTH_URL: ${PROBER_AUTH_URL:-http://api:8080/auth/v1}
      # The verification markers (#2082) are in the worker's archive bucket on MinIO, not on the archive volume.
      ARCHIVE_STORE: s3
      ARCHIVE_S3_BUCKET: ludy-archive
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
      # The read-only user minio-init makes for it (#2094), never the worker's key.
      PROBER_ARCHIVE_S3_ACCESS_KEY_ID: ludy-split-prober
      PROBER_ARCHIVE_S3_SECRET_ACCESS_KEY: ludy-split-prober-secret

  # Not needed here (sign-up is auto-confirmed); published ports would clash with a running default stack.
  mailpit:
    ports: !reset []
