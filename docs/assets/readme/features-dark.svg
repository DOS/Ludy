<svg xmlns="http://www.w3.org/2000/svg" width="880" height="376" viewBox="0 0 880 376" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif">
<title id="t">What Ludy does</title><desc id="d">AI Inbox, accounting, tax reports, Engage, bookings, meetings, notes, AI coworkers, private by design, yours to run.</desc>
<rect width="880" height="376" rx="16" fill="#0c0c10"/>
<text x="440" y="38" font-size="20" font-weight="700" fill="#f5f5f7" text-anchor="middle">Everything a small business does every month</text>
<rect x="28" y="62" width="153.6" height="144" rx="12" fill="#131318" stroke="#292930" stroke-width="1.5"/>
<rect x="42" y="76" width="36" height="36" rx="10" fill="#2f2749" stroke="none" stroke-width="1.5"/>
