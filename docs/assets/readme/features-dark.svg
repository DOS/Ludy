<text x="209.6" y="290" font-size="13.5" font-weight="700" fill="#f5f5f7" text-anchor="start">Notes and to-dos</text>
<text x="209.6" y="308" font-size="11.5" font-weight="400" fill="#adadb5" text-anchor="start">Personal notes and</text>
<text x="209.6" y="323" font-size="11.5" font-weight="400" fill="#adadb5" text-anchor="start">lists, with</text>
<text x="209.6" y="338" font-size="11.5" font-weight="400" fill="#adadb5" text-anchor="start">notifications.</text>
<rect x="363.2" y="218" width="153.6" height="144" rx="12" fill="#131318" stroke="#292930" stroke-width="1.5"/>
<rect x="377.2" y="232" width="36" height="36" rx="10" fill="#0f3329" stroke="none" stroke-width="1.5"/>
<g transform="translate(383.2 238)"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18" fill="none" stroke="#74d3b6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="377.2" y="290" font-size="13.5" font-weight="700" fill="#f5f5f7" text-anchor="start">Vy and the team</text>
<text x="377.2" y="308" font-size="11.5" font-weight="400" fill="#adadb5" text-anchor="start">AI coworkers that</text>
<text x="377.2" y="323" font-size="11.5" font-weight="400" fill="#adadb5" text-anchor="start">propose; a person</text>
<text x="377.2" y="338" font-size="11.5" font-weight="400" fill="#adadb5" text-anchor="start">decides.</text>
<rect x="530.8" y="218" width="153.6" height="144" rx="12" fill="#131318" stroke="#292930" stroke-width="1.5"/>
<rect x="544.8" y="232" width="36" height="36" rx="10" fill="#2f2749" stroke="none" stroke-width="1.5"/>
<g transform="translate(550.8 238)"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z" fill="none" stroke="#b19df9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="544.8" y="290" font-size="13.5" font-weight="700" fill="#f5f5f7" text-anchor="start">Private by design</text>
<text x="544.8" y="308" font-size="11.5" font-weight="400" fill="#adadb5" text-anchor="start">Row-level isolation</text>
<text x="544.8" y="323" font-size="11.5" font-weight="400" fill="#adadb5" text-anchor="start">and an audit log.</text>
<rect x="698.4" y="218" width="153.6" height="144" rx="12" fill="#131318" stroke="#292930" stroke-width="1.5"/>
<rect x="712.4" y="232" width="36" height="36" rx="10" fill="#0f3329" stroke="none" stroke-width="1.5"/>
