<text x="42" y="308" font-size="11.5" font-weight="400" fill="#adadb5" text-anchor="start">Record meetings. AI</text>
<text x="42" y="323" font-size="11.5" font-weight="400" fill="#adadb5" text-anchor="start">notes and summaries</text>
<text x="42" y="338" font-size="11.5" font-weight="400" fill="#adadb5" text-anchor="start">are optional.</text>
