<text x="209.6" y="134" font-size="13.5" font-weight="700" fill="#f5f5f7" text-anchor="start">Accounting (TT133)</text>
<text x="209.6" y="152" font-size="11.5" font-weight="400" fill="#adadb5" text-anchor="start">Entries that always</text>
<text x="209.6" y="167" font-size="11.5" font-weight="400" fill="#adadb5" text-anchor="start">balance, and period</text>
<text x="209.6" y="182" font-size="11.5" font-weight="400" fill="#adadb5" text-anchor="start">locks.</text>
<rect x="363.2" y="62" width="153.6" height="144" rx="12" fill="#131318" stroke="#292930" stroke-width="1.5"/>
<rect x="377.2" y="76" width="36" height="36" rx="10" fill="#2f2749" stroke="none" stroke-width="1.5"/>
