<text x="712.4" y="290" font-size="13.5" font-weight="700" fill="#f5f5f7" text-anchor="start">Yours to run</text>
<text x="712.4" y="308" font-size="11.5" font-weight="400" fill="#adadb5" text-anchor="start">Open source (AGPL).</text>
<text x="712.4" y="323" font-size="11.5" font-weight="400" fill="#adadb5" text-anchor="start">One command to start,</text>
