<text x="377.2" y="134" font-size="13.5" font-weight="700" fill="#f5f5f7" text-anchor="start">Tax and reports</text>
<text x="377.2" y="152" font-size="11.5" font-weight="400" fill="#adadb5" text-anchor="start">VAT return working,</text>
<text x="377.2" y="167" font-size="11.5" font-weight="400" fill="#adadb5" text-anchor="start">B01 and B02, Excel.</text>
<rect x="530.8" y="62" width="153.6" height="144" rx="12" fill="#131318" stroke="#292930" stroke-width="1.5"/>
<rect x="544.8" y="76" width="36" height="36" rx="10" fill="#0f3329" stroke="none" stroke-width="1.5"/>
