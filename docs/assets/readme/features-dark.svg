<text x="712.4" y="134" font-size="13.5" font-weight="700" fill="#f5f5f7" text-anchor="start">Bookings</text>
<text x="712.4" y="152" font-size="11.5" font-weight="400" fill="#adadb5" text-anchor="start">Booking pages, event</text>
<text x="712.4" y="167" font-size="11.5" font-weight="400" fill="#adadb5" text-anchor="start">types, working hours.</text>
