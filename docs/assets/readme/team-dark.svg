<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif">
<title id="t">Your Ludy team</title><desc id="d">You approve. Vy coordinates. Ly reads invoices, Dy handles customers and sales, Uy drafts posts. The AI proposes, you decide.</desc>
<rect width="880" height="392" rx="16" fill="#0c0c10"/>
<text x="440" y="38" font-size="20" font-weight="700" fill="#f5f5f7" text-anchor="middle">Your team: you decide, the AI coworkers do the work</text>
<rect x="68" y="62" width="292" height="74" rx="12" fill="#131318" stroke="#575760" stroke-width="1.5"/>
<circle cx="100" cy="99" r="18" fill="#2f2749" stroke="#b19df9" stroke-width="1.5"/><text x="100" y="105" font-size="12" font-weight="700" fill="#b19df9" text-anchor="middle">You</text>
<text x="128" y="94" font-size="16" font-weight="700" fill="#f5f5f7" text-anchor="start">You</text>
<text x="128" y="112" font-size="11.5" font-weight="400" fill="#919199" text-anchor="start">Owner. Approves money and messages.</text>
<rect x="520" y="62" width="250" height="108" rx="12" fill="#131318" stroke="#b19df9" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="552" cy="98" r="18" fill="#2f2749" stroke="#b19df9" stroke-width="1.5" stroke-dasharray="3 3"/><text x="552" y="104" font-size="17" font-weight="700" fill="#b19df9" text-anchor="middle">V</text><text x="580" y="94" font-size="16" font-weight="700" fill="#f5f5f7" text-anchor="start">Vy</text><text x="580" y="112" font-size="12" font-weight="400" fill="#919199" text-anchor="start">General manager (AI)</text><text x="536" y="144" font-size="13" font-weight="400" fill="#adadb5" text-anchor="start">Coordinates the team,</text><text x="536" y="162" font-size="13" font-weight="400" fill="#adadb5" text-anchor="start">across every app</text>
<path d="M360 99H520" fill="none" stroke="#575760" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="386" y="76" width="108" height="22" rx="11" fill="#0f3329" stroke="none" stroke-width="1.5"/><text x="440" y="91" font-size="12" font-weight="600" fill="#74d3b6" text-anchor="middle">you approve</text>
<path d="M645 170V196H430V218" fill="none" stroke="#575760" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M645 196H154V218" fill="none" stroke="#575760" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M645 196H706V218" fill="none" stroke="#575760" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="28" y="218" width="252" height="146" rx="12" fill="#131318" stroke="#b19df9" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="60" cy="254" r="18" fill="#2f2749" stroke="#b19df9" stroke-width="1.5" stroke-dasharray="3 3"/><text x="60" y="260" font-size="17" font-weight="700" fill="#b19df9" text-anchor="middle">L</text><text x="88" y="250" font-size="16" font-weight="700" fill="#f5f5f7" text-anchor="start">Ly</text><text x="88" y="268" font-size="12" font-weight="400" fill="#919199" text-anchor="start">Accounting (AI)</text><text x="44" y="300" font-size="13" font-weight="400" fill="#adadb5" text-anchor="start">Reads invoices, drafts the</text><text x="44" y="318" font-size="13" font-weight="400" fill="#adadb5" text-anchor="start">journal entry for you</text><rect x="44" y="330" width="189.6" height="22" rx="11" fill="#0f3329" stroke="none" stroke-width="1.5"/><text x="138.8" y="345" font-size="12" font-weight="600" fill="#74d3b6" text-anchor="middle">checked by rules, then you</text>
<rect x="304" y="218" width="252" height="146" rx="12" fill="#131318" stroke="#b19df9" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="336" cy="254" r="18" fill="#2f2749" stroke="#b19df9" stroke-width="1.5" stroke-dasharray="3 3"/><text x="336" y="260" font-size="17" font-weight="700" fill="#b19df9" text-anchor="middle">D</text><text x="364" y="250" font-size="16" font-weight="700" fill="#f5f5f7" text-anchor="start">Dy</text><text x="364" y="268" font-size="12" font-weight="400" fill="#919199" text-anchor="start">Sales and customers (AI)</text><text x="320" y="300" font-size="13" font-weight="400" fill="#adadb5" text-anchor="start">The Inbox, your customers</text><text x="320" y="318" font-size="13" font-weight="400" fill="#adadb5" text-anchor="start">and your sales</text><rect x="320" y="330" width="123.6" height="22" rx="11" fill="#0f3329" stroke="none" stroke-width="1.5"/><text x="381.8" y="345" font-size="12" font-weight="600" fill="#74d3b6" text-anchor="middle">drafts, you send</text>
<rect x="580" y="218" width="252" height="146" rx="12" fill="#131318" stroke="#b19df9" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="612" cy="254" r="18" fill="#2f2749" stroke="#b19df9" stroke-width="1.5" stroke-dasharray="3 3"/><text x="612" y="260" font-size="17" font-weight="700" fill="#b19df9" text-anchor="middle">U</text><text x="640" y="250" font-size="16" font-weight="700" fill="#f5f5f7" text-anchor="start">Uy</text><text x="640" y="268" font-size="12" font-weight="400" fill="#919199" text-anchor="start">Marketing (AI)</text><text x="596" y="300" font-size="13" font-weight="400" fill="#adadb5" text-anchor="start">Drafts and schedules</text><text x="596" y="318" font-size="13" font-weight="400" fill="#adadb5" text-anchor="start">your posts</text><rect x="596" y="330" width="90.6" height="22" rx="11" fill="#0f3329" stroke="none" stroke-width="1.5"/><text x="641.3" y="345" font-size="12" font-weight="600" fill="#74d3b6" text-anchor="middle">you publish</text>
</svg>
